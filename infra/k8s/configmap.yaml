apiVersion: v1
kind: ConfigMap
metadata: {name: sbc-enterprise-config}
data:
  SBC_ORCHESTRATION: kubernetes
  SBC_AUTOMATION_STATE_BACKEND: durable
  SBC_REDIS_SESSION_TTL_SECONDS: "604800"
  SBC_GRAPHQL_CACHE_TTL_SECONDS: "30"
  SBC_GRAPHQL_CACHE_MAX_ENTRIES: "1000"
  SBC_DEMO_WORKER_AUTH_REQUIRED: "true"
  SBC_ZERO_TRUST_MODE: ready
  SBC_CHAOS_ENABLED: "false"
  SBC_EDGE_CACHE_TTL_MS: "600000"
  SBC_EDGE_CACHE_STALE_MS: "300000"
  SBC_MESSAGE_QUEUE_TARGET: "50"
