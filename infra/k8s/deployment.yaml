apiVersion: apps/v1
kind: Deployment
metadata:
  name: sbc-command-center
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sbc-command-center
  template:
    metadata:
      labels:
        app: sbc-command-center
    spec:
      containers:
        - name: sbc
          image: sbc-business-command-center:55.0.0
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: sbc-enterprise-config
            - secretRef:
                name: sbc-command-center-secrets
                optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: file-staging
              mountPath: /app/data/file-staging
          readinessProbe:
            httpGet:
              path: /__sbc_health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /__sbc_health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: file-staging
          persistentVolumeClaim:
            claimName: sbc-file-staging
---
apiVersion: v1
kind: Service
metadata:
  name: sbc-command-center
spec:
  selector:
    app: sbc-command-center
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sbc-command-center
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sbc-command-center
  minReplicas: 2
  maxReplicas: 20
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
    # Requires a Kubernetes custom/external-metrics adapter exposing this metric.
    # CPU/memory remain the safe fallback when the queue metric is unavailable.
    - type: External
      external:
        metric:
          name: sbc_message_queue_depth
        target:
          type: AverageValue
          averageValue: "50"
