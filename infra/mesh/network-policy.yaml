apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sbc-command-center-default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: sbc-gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sbc-system
          podSelector:
            matchLabels:
              app: sbc-gateway
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: sbc-command-center
      ports:
        - protocol: TCP
          port: 3000
    - to:
        - podSelector:
            matchLabels:
              app: sbc-mysql
      ports:
        - protocol: TCP
          port: 3306
    - to:
        - podSelector:
            matchLabels:
              app: sbc-redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
