name: Build GoDaddy Full ZIP
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-godaddy-full-zip.yml'
      - 'bootstrap.js'
      - 'package.json'
      - 'package-lock.json'
      - 'hotfix-assets/**'
      - 'enterprise/**'
      - 'scripts/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release identity and build
        run: |
          node --check bootstrap.js
          node hotfix-assets/v6573-release-503-forms-test.js
          node hotfix-assets/v6600-release-layout-test.js
          node scripts/query-guard-cleanup-regression.test.js
      - name: Assemble repository and GoDaddy deployment package
        run: |
          set -euo pipefail
          mkdir -p dist/SBC-V66.0.0-GoDaddy-FULL-BUILD
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='dist' ./ dist/SBC-V66.0.0-GoDaddy-FULL-BUILD/
          test -f dist/SBC-V66.0.0-GoDaddy-FULL-BUILD/bootstrap.js
          test -f dist/SBC-V66.0.0-GoDaddy-FULL-BUILD/package.json
          node -e "const p=require('./dist/SBC-V66.0.0-GoDaddy-FULL-BUILD/package.json');if(p.version!=='66.0.0')process.exit(2)"
          cd dist/SBC-V66.0.0-GoDaddy-FULL-BUILD
          zip -qr ../SBC-V66.0.0-GoDaddy-FULL-BUILD.zip .
          cd ..
          unzip -t SBC-V66.0.0-GoDaddy-FULL-BUILD.zip
          unzip -Z1 SBC-V66.0.0-GoDaddy-FULL-BUILD.zip | grep -qx 'package.json'
          unzip -Z1 SBC-V66.0.0-GoDaddy-FULL-BUILD.zip | grep -qx 'package-lock.json'
          unzip -Z1 SBC-V66.0.0-GoDaddy-FULL-BUILD.zip | grep -qx 'bootstrap.js'
          unzip -Z1 SBC-V66.0.0-GoDaddy-FULL-BUILD.zip | grep -qx 'SBC-OS-V65.1.13-ROOT-FIXED-LOCKFILE-BLOCKED.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: SBC-V66.0.0-GoDaddy-FULL-BUILD
          path: dist/SBC-V66.0.0-GoDaddy-FULL-BUILD.zip
          if-no-files-found: error
          retention-days: 14
