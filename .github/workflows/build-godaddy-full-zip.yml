name: Build GoDaddy Full ZIP
# Final V6646 Published-only API read budget and owner slowdown telemetry source-bound package.
# Final V6645 source-bound Square payment-proof and read-only location diagnostics release.
# Final V6644: verify owner-hold fairness in the source-bound compiled runtime before packaging.
# Final V6643 release: package only the source-matched, restart-tested Kevin veto runtime.
# Release packaging includes compiled Kim V6642 financial, tenant and save-failure regression gate.
# Release gate: package only the prebuilt V66 runtime that passed the V6641 fulfillment test.
# A source-only commit must first pass SBC Offline Reconstruction Evidence Gate.
# That gate commits a fresh, source-fingerprinted runtime to main. Only then
# should this workflow run. Otherwise every source PR produces a predictable
# stale prebuilt failure before the verified runtime can be published.
on:
  push:
    branches: [main]
    paths:
      - 'SBC-V66-PREBUILT-RUNTIME.zip'
      - 'SBC-V66-PREBUILT-RUNTIME.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release identity and build
        run: |
          set -euo pipefail
          node --check bootstrap.js
          node --check scripts/prebuilt-runtime.cjs
          node scripts/prebuilt-runtime.test.cjs
          node scripts/v6639-published-read-poll-guard.test.cjs
          node scripts/v6640-payment-evidence-and-square-preflight.test.cjs
          node scripts/sbc-strict-95-release-scorecard.test.cjs
          # This job never ships the legacy fallback on its own: source-only
          # changes are reconstructed separately and must publish BOTH files.
          test -s SBC-V66-PREBUILT-RUNTIME.zip
          test -s SBC-V66-PREBUILT-RUNTIME.json
          node - <<'NODE'
          const {readManifest}=require('./scripts/prebuilt-runtime.cjs');
          const result=readManifest(process.cwd());
          if(!result || result.manifest.generatedBy!=='isolated-github-ci')
            throw Error('GoDaddy archive needs verified isolated CI receipt');
          console.log('[SBC FINAL PACKAGE] MATCHED SOURCE',result.manifest.sourceFingerprint,
            'SOURCE COMMIT',result.manifest.sourceCommit);
          NODE
          # These tests operate on the exact extracted runtime being shipped,
          # not merely on source patch scripts.
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          unzip -q SBC-V66-PREBUILT-RUNTIME.zip -d "$verify_dir"
          SBC_RUNTIME_ROOT="$verify_dir" node scripts/v6640-compiled-payment-truth.test.cjs
          SBC_RUNTIME_ROOT="$verify_dir" node scripts/v6641-fulfillment-payment-gate.test.cjs
          SBC_RUNTIME_ROOT="$verify_dir" node scripts/v6642-kim-mission-financial-governance.test.cjs
          SBC_RUNTIME_ROOT="$verify_dir" node scripts/v6643-kevin-durable-owner-veto.test.cjs
          SBC_RUNTIME_ROOT="$verify_dir" node scripts/v6644-owner-hold-fair-batch.test.cjs
          SBC_RUNTIME_ROOT="$verify_dir" node scripts/v6645-square-checkout-safety.test.cjs
          SBC_RUNTIME_ROOT="$verify_dir" node scripts/v6646-published-read-budget.test.cjs
          rm -rf "$verify_dir"
          trap - EXIT
          node hotfix-assets/v6600-release-layout-test.js
          node scripts/query-guard-cleanup-regression.test.js
      - name: Cache real pinned browser Voice SDK for offline GoDaddy startup
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix .sbc-twilio-sdk --no-save --ignore-scripts --no-audit --no-fund '@twilio/voice-sdk@2.18.5'
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const base='.sbc-twilio-sdk/node_modules/@twilio/voice-sdk';
          const p=JSON.parse(fs.readFileSync(base+'/package.json','utf8'));
          const file=base+'/dist/twilio.min.js';
          if(p.version!=='2.18.5'||fs.statSync(file).size<100000)throw Error('Invalid local Twilio browser SDK');
          const got=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const expected='35d3cb1b22e309f9884724a89250aecd2de4f1556ad7b67a7bc5e06c73dcb74a';
          if(got!==expected)throw Error('Twilio SDK version-pinned SHA-256 mismatch');
          console.log('PINNED_SDK_VERIFIED',p.version,got);
          NODE
      - name: Assemble repository and GoDaddy deployment package
        run: |
          set -euo pipefail
          mkdir -p dist/SBC-V66.0.0-GoDaddy-FULL-BUILD
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='dist' ./ dist/SBC-V66.0.0-GoDaddy-FULL-BUILD/
          # rsync excludes node_modules globally; restore the exact pinned browser SDK.
          mkdir -p dist/SBC-V66.0.0-GoDaddy-FULL-BUILD/.sbc-twilio-sdk/node_modules/@twilio
          cp -a .sbc-twilio-sdk/node_modules/@twilio/voice-sdk dist/SBC-V66.0.0-GoDaddy-FULL-BUILD/.sbc-twilio-sdk/node_modules/@twilio/
          test -s dist/SBC-V66.0.0-GoDaddy-FULL-BUILD/.sbc-twilio-sdk/node_modules/@twilio/voice-sdk/dist/twilio.min.js
          test -f dist/SBC-V66.0.0-GoDaddy-FULL-BUILD/bootstrap.js
          test -f dist/SBC-V66.0.0-GoDaddy-FULL-BUILD/package.json
          node -e "const p=require('./dist/SBC-V66.0.0-GoDaddy-FULL-BUILD/package.json');if(p.version!=='66.0.0')process.exit(2)"
          cd dist/SBC-V66.0.0-GoDaddy-FULL-BUILD
          zip -qr ../SBC-V66.0.0-GoDaddy-FULL-BUILD.zip .
          cd ..
          unzip -t SBC-V66.0.0-GoDaddy-FULL-BUILD.zip
          unzip -Z1 SBC-V66.0.0-GoDaddy-FULL-BUILD.zip | grep -qx 'package.json'
          unzip -Z1 SBC-V66.0.0-GoDaddy-FULL-BUILD.zip | grep -qx 'package-lock.json'
          unzip -Z1 SBC-V66.0.0-GoDaddy-FULL-BUILD.zip | grep -qx 'bootstrap.js'
          if test -f SBC-V66.0.0-GoDaddy-FULL-BUILD/SBC-V66-PREBUILT-RUNTIME.zip; then
            unzip -Z1 SBC-V66.0.0-GoDaddy-FULL-BUILD.zip | grep -qx 'SBC-V66-PREBUILT-RUNTIME.zip'
            unzip -Z1 SBC-V66.0.0-GoDaddy-FULL-BUILD.zip | grep -qx 'SBC-V66-PREBUILT-RUNTIME.json'
          fi
          unzip -Z1 SBC-V66.0.0-GoDaddy-FULL-BUILD.zip | grep -qx 'SBC-OS-V65.1.13-ROOT-FIXED-LOCKFILE-BLOCKED.zip'
          unzip -Z1 SBC-V66.0.0-GoDaddy-FULL-BUILD.zip | grep -qx '.sbc-twilio-sdk/node_modules/@twilio/voice-sdk/package.json'
          unzip -Z1 SBC-V66.0.0-GoDaddy-FULL-BUILD.zip | grep -qx '.sbc-twilio-sdk/node_modules/@twilio/voice-sdk/dist/twilio.min.js'
          unzip -p SBC-V66.0.0-GoDaddy-FULL-BUILD.zip '.sbc-twilio-sdk/node_modules/@twilio/voice-sdk/dist/twilio.min.js' | sha256sum | grep -q '^35d3cb1b22e309f9884724a89250aecd2de4f1556ad7b67a7bc5e06c73dcb74a '
          sha256sum SBC-V66.0.0-GoDaddy-FULL-BUILD.zip | tee SBC-V66.0.0-GoDaddy-FULL-BUILD.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: SBC-V66.0.0-GoDaddy-FULL-BUILD
          path: |
            dist/SBC-V66.0.0-GoDaddy-FULL-BUILD.zip
            dist/SBC-V66.0.0-GoDaddy-FULL-BUILD.sha256
          if-no-files-found: error
          retention-days: 14
