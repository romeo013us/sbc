name: SBC V66 Release Identity and Reconciliation Regression
on:
  pull_request:
    branches: [a-sbc-master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Secret audit — known synthetic fixtures, real credentials still blocked
        run: node scripts/secret-audit.js
      - name: Synthetic CSV/SQL reconciliation — never access customer records
        run: node scripts/reconciliation-audit-test.js
      - name: Verify source contract (strict deployment hash is checked on staged ZIP)
        run: |
          node --test test/sbc-flat-release-modes.test.cjs
          node scripts/v6603-flat-release-contract.test.cjs --source-only
      - name: Recovery, buyer demo, signed handoff regression
        run: |
          node scripts/v6510-ui-recovery-buttons-test.js
          node scripts/v6513-recovery-safe-training-test.js
          node scripts/v6515-buyer-demo-stability-test.js
          node scripts/v6674-officebox-v2-handoff.test.cjs
      - name: Preview version and browser safety contract (source-only)
        run: |
          node --test test/v66-preview-browser-acceptance.test.cjs
          node scripts/v66-preview-browser-acceptance.cjs --self-test
          node --test scripts/v66-owner-openai-budget.test.cjs
          node --test scripts/sbc-website-studio-v2-elite.test.cjs
          node --test scripts/sbc-website-studio-v3-editor.test.cjs
          node --test scripts/sbc-website-studio-owner.test.cjs
          node --test scripts/sbc-website-studio-media.test.cjs
          node --test scripts/sbc-website-studio-v4-brand-comparison.test.cjs
          node --test scripts/sbc-website-studio-v4-freeform-grid.test.cjs
          node --test scripts/sbc-website-studio-soft-contrast.test.cjs
          node --test scripts/sbc-website-studio-workspace.test.cjs
