name: SBC Offline Browser UX and Visual Audit
on:
  pull_request:
    branches: [a-sbc-master]
    paths:
      - 'scripts/sbc-offline-visual-audit.py'
      - 'scripts/sbc-owner-clean-display-browser.py'
      - 'test/sbc-offline-layout-fixes.test.cjs'
      - 'test/sbc-owner-six-card-home.test.cjs'
      - '.github/workflows/sbc-offline-browser-audit.yml'
      - 'public/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workstations-offline-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout verified offline source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Verify owner login and mobile navigation regression guards
        run: node --test test/sbc-offline-layout-fixes.test.cjs test/sbc-owner-six-card-home.test.cjs
      - name: Install local Chromium test runtime
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify clean owner display and reversible shortcuts in Chromium
        run: python scripts/sbc-owner-clean-display-browser.py
      - name: Run 15 static screenshots and layout/contrast checks
        run: python scripts/sbc-offline-visual-audit.py
      - name: Preserve offline screenshots and machine-readable findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SBC-Offline-Visual-Audit
          path: test-results/offline-visual/
          if-no-files-found: warn
          retention-days: 14
