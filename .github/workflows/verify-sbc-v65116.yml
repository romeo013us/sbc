name: Verify SBC OS V65.1.28 Demo Studio

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap.js'
      - 'package.json'
      - 'package-lock.json'
      - 'persistent-state.js'
      - 'persistent-state-test.js'
      - 'hotfix-assets/**'
      - 'SBC-OS-V65.1.13-ROOT-FIXED-LOCKFILE-BLOCKED.zip'
      - '.github/workflows/verify-sbc-v65116.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate release identity and launch files
        run: |
          set -euo pipefail
          node --check bootstrap.js
          node --check hotfix-assets/apply-v6528-runtime-writer-lease.js
          node --check hotfix-assets/v6528-runtime-writer-lease-test.js
          node -e "const p=require('./package.json'); if(p.name!=='sbc-business-command-center'||p.version!=='65.1.28'||p.main!=='bootstrap.js'||p.scripts.start!=='node bootstrap.js') { console.error('Unexpected release identity or entrypoint', p.name, p.version, p.main, p.scripts.start); process.exit(1); } console.log(p.name+'@'+p.version)"
          test -f SBC-OS-V65.1.13-ROOT-FIXED-LOCKFILE-BLOCKED.zip
          test -f persistent-state.js
          test -f persistent-state-test.js
          test -f hotfix-assets/apply-v6526-demo-studio.js
          test -f hotfix-assets/v6526-demo-studio-test.js
          test -f hotfix-assets/apply-v6528-runtime-writer-lease.js
          test -f hotfix-assets/v6528-runtime-writer-lease-test.js

      - name: Install locked root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify SBC root release build
        run: npm run build

      - name: Run complete SBC regression suite
        run: npm run test:all
