name: Verify SBC OS V65.1.32 Published Auth Stability

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap.js'
      - 'package.json'
      - 'package-lock.json'
      - 'persistent-state.js'
      - 'persistent-state-test.js'
      - 'apply-v65116-hotfix.js'
      - 'hotfix-assets/**'
      - 'SBC-OS-V65.1.13-ROOT-FIXED-LOCKFILE-BLOCKED.zip'
      - '.github/workflows/verify-sbc-v65116.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate V65.1.32 release identity and launch files
        run: |
          set -euo pipefail
          node --check bootstrap.js
          node --check persistent-state.js
          node --check persistent-state-test.js
          node --check hotfix-assets/apply-v6528-runtime-writer-lease.js
          node --check hotfix-assets/v6528-runtime-writer-lease-test.js
          node --check hotfix-assets/apply-v6529-open-readiness.js
          node --check hotfix-assets/v6529-open-readiness-test.js
          node --check hotfix-assets/apply-v6530-writer-lease-marker-fix.js
          node --check hotfix-assets/v6530-writer-lease-marker-fix-test.js
          node --check hotfix-assets/apply-v6531-release-identity.js
          node --check hotfix-assets/v6531-release-identity-test.js
          node --check hotfix-assets/durable-session-secret.js
          node --check hotfix-assets/apply-v6532-published-auth-stability.js
          node --check hotfix-assets/v6532-published-auth-stability-test.js
          node --check hotfix-assets/apply-v6530-writer-lease-marker-fix.js
          node --check hotfix-assets/v6530-writer-lease-marker-fix-test.js
          node --check hotfix-assets/apply-v6531-release-identity.js
          node --check hotfix-assets/v6531-release-identity-test.js
          node -e "const p=require('./package.json'); if(p.name!=='sbc-business-command-center'||p.version!=='65.1.32'||p.main!=='bootstrap.js'||p.scripts.start!=='node bootstrap.js') { console.error('Unexpected release identity or entrypoint', p.name, p.version, p.main, p.scripts.start); process.exit(1); } console.log(p.name+'@'+p.version)"
          test -f SBC-OS-V65.1.13-ROOT-FIXED-LOCKFILE-BLOCKED.zip
          test -f hotfix-assets/apply-v6526-demo-studio.js
          test -f hotfix-assets/v6526-demo-studio-test.js
          test -f hotfix-assets/apply-v6527-persistence-writer-lock.js
          test -f hotfix-assets/v6527-persistence-writer-lock-test.js
          test -f hotfix-assets/apply-v6528-runtime-writer-lease.js
          test -f hotfix-assets/v6528-runtime-writer-lease-test.js
          test -f hotfix-assets/apply-v6529-open-readiness.js
          test -f hotfix-assets/v6529-open-readiness-test.js
          test -f hotfix-assets/apply-v6530-writer-lease-marker-fix.js
          test -f hotfix-assets/v6530-writer-lease-marker-fix-test.js
          test -f hotfix-assets/apply-v6531-release-identity.js
          test -f hotfix-assets/v6531-release-identity-test.js
          test -f RELEASE-NOTES-V65.1.29-OPEN-READINESS.md
          test -f hotfix-assets/apply-v6530-writer-lease-marker-fix.js
          test -f hotfix-assets/v6530-writer-lease-marker-fix-test.js
          test -f hotfix-assets/apply-v6531-release-identity.js
          test -f hotfix-assets/v6531-release-identity-test.js
          test -f hotfix-assets/durable-session-secret.js
          test -f hotfix-assets/apply-v6532-published-auth-stability.js
          test -f hotfix-assets/v6532-published-auth-stability-test.js
          unzip -t SBC-OS-V65.1.13-ROOT-FIXED-LOCKFILE-BLOCKED.zip

      - name: Install locked root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify SBC root release build
        run: npm run build

      - name: Read-only audit of source startup DDL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-audit
          unzip -q SBC-OS-V65.1.13-ROOT-FIXED-LOCKFILE-BLOCKED.zip -d source-audit
          ROOT=source-audit
          if [ ! -f "$ROOT/server.js" ] && [ -f "$ROOT/SBC-OS/server.js" ]; then ROOT="$ROOT/SBC-OS"; fi
          test -f "$ROOT/server.js"
          echo '--- DDL statements in source JS ---'
          grep -R -n -i -E 'CREATE[[:space:]]+(TABLE|INDEX|DATABASE)|ALTER[[:space:]]+(TABLE|DATABASE)|DROP[[:space:]]+(TABLE|DATABASE)|RENAME[[:space:]]+TABLE|TRUNCATE[[:space:]]+TABLE' "$ROOT" --include='*.js' --exclude-dir=node_modules | head -300 || true
          echo '--- schema/migration entrypoints ---'
          grep -R -n -E 'ensureSchema|ensureEnterpriseSchema|runMigrations|migrate|initMysql|schemaSync|syncSchema' "$ROOT/server.js" "$ROOT/enterprise" "$ROOT/routes" --include='*.js' 2>/dev/null | head -300 || true
          echo '--- boot-time schema call sites ---'
          grep -n -B 12 -A 20 -E 'ensureSchema|ensureEnterpriseSchema|runMigrations|migrate|CREATE TABLE|ALTER TABLE' "$ROOT/server.js" | head -300 || true

      - name: Run complete SBC regression suite
        run: npm run test:all
