name: Verify SBC OS V65.1.42 Voice Diagnostics and Startup Safety

on:
  push:
    branches: [main, 'chore/**']
    paths:
      - 'bootstrap.js'
      - 'runtime-env-beacon.js'
      - 'runtime-env-beacon-test.js'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/ensure-runtime-dependencies.js'
      - 'persistent-state.js'
      - 'persistent-state-test.js'
      - 'apply-v65116-hotfix.js'
      - 'hotfix-assets/**'
      - 'SBC-OS-V65.1.13-ROOT-FIXED-LOCKFILE-BLOCKED.zip'
      - '.github/workflows/verify-sbc-v65116.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate V65.1.42 release identity and launch files
        run: |
          set -euo pipefail
          node --check bootstrap.js
          node --check scripts/ensure-runtime-dependencies.js
          node --check runtime-env-beacon.js
          node --check runtime-env-beacon-test.js
          node --check persistent-state.js
          node --check persistent-state-test.js
          node --check hotfix-assets/apply-v6528-runtime-writer-lease.js
          node --check hotfix-assets/v6528-runtime-writer-lease-test.js
          node --check hotfix-assets/apply-v6529-open-readiness.js
          node --check hotfix-assets/v6529-open-readiness-test.js
          node --check hotfix-assets/apply-v6530-writer-lease-marker-fix.js
          node --check hotfix-assets/v6530-writer-lease-marker-fix-test.js
          node --check hotfix-assets/apply-v6531-release-identity.js
          node --check hotfix-assets/v6531-release-identity-test.js
          node --check hotfix-assets/durable-session-secret.js
          node --check hotfix-assets/apply-v6533-startup-ddl-gate.js
          node --check hotfix-assets/v6533-startup-ddl-gate-test.js
          node --check hotfix-assets/apply-v6534-price-consistency.js
          node --check hotfix-assets/v6534-price-consistency-test.js
          node --check hotfix-assets/apply-v6535-writer-no-ddl-operational-startup.js
          node --check hotfix-assets/v6535-writer-no-ddl-operational-startup-test.js
          node --check hotfix-assets/apply-v6536-runtime-beacon.js
          node --check hotfix-assets/v6536-runtime-beacon-test.js
          node --check hotfix-assets/apply-v6537-effective-runtime-role.js
          node --check hotfix-assets/v6537-effective-runtime-role-test.js
          node --check hotfix-assets/apply-v6538-writer-hydration-without-ddl.js
          node --check hotfix-assets/v6538-writer-hydration-without-ddl-test.js
          node --check hotfix-assets/apply-v6539-safe-no-ddl-startup.js
          node --check hotfix-assets/apply-v6541-lead-import.js
          node --check hotfix-assets/apply-v6542-voice-call-diagnostics.js
          node --check hotfix-assets/v6542-voice-call-diagnostics-test.js
          node --check hotfix-assets/lead-import-v6541.js
          node --check hotfix-assets/v6541-lead-import-test.js
          node --check hotfix-assets/v6539-safe-no-ddl-startup-test.js
          node --check scripts/v65137-startup-sequence.test.js
          node --check scripts/v6539-trace-startup-ddl-blocker.js
          node --check hotfix-assets/apply-v6530-writer-lease-marker-fix.js
          node --check hotfix-assets/v6530-writer-lease-marker-fix-test.js
          node --check hotfix-assets/apply-v6531-release-identity.js
          node --check hotfix-assets/v6531-release-identity-test.js
          node -e "const p=require('./package.json'); if(p.name!=='sbc-business-command-center'||p.version!=='65.1.42'||p.main!=='bootstrap.js'||p.scripts.start!=='node bootstrap.js') { console.error('Unexpected release identity or entrypoint', p.name, p.version, p.main, p.scripts.start); process.exit(1); } console.log(p.name+'@'+p.version)"
          test -f SBC-OS-V65.1.13-ROOT-FIXED-LOCKFILE-BLOCKED.zip
          test -f hotfix-assets/apply-v6526-demo-studio.js
          test -f hotfix-assets/v6526-demo-studio-test.js
          test -f hotfix-assets/apply-v6527-persistence-writer-lock.js
          test -f hotfix-assets/v6527-persistence-writer-lock-test.js
          test -f hotfix-assets/apply-v6528-runtime-writer-lease.js
          test -f hotfix-assets/v6528-runtime-writer-lease-test.js
          test -f hotfix-assets/apply-v6529-open-readiness.js
          test -f hotfix-assets/v6529-open-readiness-test.js
          test -f hotfix-assets/apply-v6530-writer-lease-marker-fix.js
          test -f hotfix-assets/v6530-writer-lease-marker-fix-test.js
          test -f hotfix-assets/apply-v6531-release-identity.js
          test -f hotfix-assets/v6531-release-identity-test.js
          test -f RELEASE-NOTES-V65.1.29-OPEN-READINESS.md
          test -f hotfix-assets/apply-v6530-writer-lease-marker-fix.js
          test -f hotfix-assets/v6530-writer-lease-marker-fix-test.js
          test -f hotfix-assets/apply-v6531-release-identity.js
          test -f hotfix-assets/v6531-release-identity-test.js
          test -f hotfix-assets/durable-session-secret.js
          test -f hotfix-assets/apply-v6533-startup-ddl-gate.js
          test -f hotfix-assets/v6533-startup-ddl-gate-test.js
          test -f hotfix-assets/apply-v6534-price-consistency.js
          test -f hotfix-assets/v6534-price-consistency-test.js
          test -f hotfix-assets/apply-v6535-writer-no-ddl-operational-startup.js
          test -f hotfix-assets/v6535-writer-no-ddl-operational-startup-test.js
          test -f hotfix-assets/apply-v6536-runtime-beacon.js
          test -f hotfix-assets/v6536-runtime-beacon-test.js
          test -f hotfix-assets/apply-v6537-effective-runtime-role.js
          test -f hotfix-assets/v6537-effective-runtime-role-test.js
          test -f hotfix-assets/apply-v6538-writer-hydration-without-ddl.js
          test -f hotfix-assets/v6538-writer-hydration-without-ddl-test.js
          test -f hotfix-assets/apply-v6539-safe-no-ddl-startup.js
          test -f hotfix-assets/v6539-safe-no-ddl-startup-test.js
          test -f hotfix-assets/apply-v6541-lead-import.js
          test -f hotfix-assets/lead-import-v6541.js
          test -f hotfix-assets/v6541-lead-import-test.js
          test -f hotfix-assets/apply-v6542-voice-call-diagnostics.js
          test -f hotfix-assets/v6542-voice-call-diagnostics-test.js
          test -f scripts/v65137-startup-sequence.test.js
          unzip -t SBC-OS-V65.1.13-ROOT-FIXED-LOCKFILE-BLOCKED.zip

      - name: Install locked root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify dayjs runtime entrypoints
        run: node scripts/ensure-runtime-dependencies.js --check

      - name: Verify SBC root release build
        run: npm run build

      - name: Trace patched production startup DDL blocker
        run: node scripts/v6539-trace-startup-ddl-blocker.js

      - name: Run complete SBC regression suite
        run: npm run test:all

      - name: Package V65.1.42 GoDaddy patch
        if: success()
        run: |
          set -euo pipefail
          mkdir -p dist/SBC-V65.1.42-GoDaddy-Lead-Import-and-Voice-Fix/hotfix-assets
          mkdir -p dist/SBC-V65.1.42-GoDaddy-Lead-Import-and-Voice-Fix/scripts
          cp bootstrap.js package.json package-lock.json dist/SBC-V65.1.42-GoDaddy-Lead-Import-and-Voice-Fix/
          cp hotfix-assets/apply-v6541-lead-import.js hotfix-assets/lead-import-v6541.js hotfix-assets/v6541-lead-import-test.js hotfix-assets/apply-v6542-voice-call-diagnostics.js hotfix-assets/v6542-voice-call-diagnostics-test.js dist/SBC-V65.1.42-GoDaddy-Lead-Import-and-Voice-Fix/hotfix-assets/
          cp scripts/v65137-startup-sequence.test.js dist/SBC-V65.1.42-GoDaddy-Lead-Import-and-Voice-Fix/scripts/
          cat > dist/SBC-V65.1.42-GoDaddy-Lead-Import-and-Voice-Fix/README.txt <<'EOF'
          SBC OS V65.1.42 — Lead Import and Voice Diagnostics Patch
          ===========================================
          
          Contents: the root launcher/manifests, Lead Import screen, and improved Twilio calling diagnostics.
          
          BEFORE INSTALLING
          1. Back up the matching files from your current GoDaddy app root.
          2. Confirm this is the SBC Preview deployment, not Published/Live.
          3. Do not modify database tables, secrets, ENABLE_DDL, recovery flags, or writer-lease settings.
          
          INSTALL
          1. Extract this ZIP into the SBC application root, preserving the included folders.
          2. Allow overwrite only for the files contained in this patch.
          3. Restart the SBC Preview Node.js app in GoDaddy.
          4. Confirm the app reports release 65.1.42, the "Import Leads" button appears, and calling errors identify missing Twilio configuration.
          5. Open Import Leads, select the SBC barber-shop CSV, choose Preview import, review duplicates, then choose Import new leads.
          6. If the server says imports are locked, stop. That means the existing recovery/read-only/writer gate is doing its job; do not bypass it.
          
          The patch adds a tenant-scoped, owner-only import endpoint. Preview is read-only. Actual inserts use a transaction, skip detected duplicates, and fail closed if tenant_id is absent or the existing write gate is closed.
          
          Do not deploy to Published/Live until Preview startup, duplicate preview, and an authorized test import have been verified.
          EOF
          cd dist/SBC-V65.1.42-GoDaddy-Lead-Import-and-Voice-Fix
          zip -qr ../SBC-V65.1.42-GoDaddy-Lead-Import-and-Voice-Fix.zip bootstrap.js package.json package-lock.json hotfix-assets scripts README.txt

      - name: Upload GoDaddy patch artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SBC-V65.1.42-GoDaddy-Lead-Import-and-Voice-Fix
          path: dist/SBC-V65.1.42-GoDaddy-Lead-Import-and-Voice-Fix.zip
          if-no-files-found: error
          retention-days: 14
