name: SBC Academy 360 - Automatic Video Audio Photos
on:
  push:
    branches: [a-sbc-master]
    paths:
      - .github/workflows/sbc-academy360-auto-media.yml
      - scripts/academy360-auto-media.cjs
      - scripts/academy360-auto-media.test.cjs
      - enterprise/sbc-am-academy-v1.cjs
      - enterprise/sbc-am-academy-es-v2.cjs
      - public/sbc-account-manager-v1.html
      - public/sbc-account-manager-v1.css
      - public/sbc-account-manager-v1.js
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: academy360-generated-training-media
  cancel-in-progress: true
jobs:
  produce:
    if: github.ref == 'refs/heads/a-sbc-master'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out approved SBC source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install local browser video and narration tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.58.0
          npx playwright install --with-deps chromium
      - name: Install pinned local neural narrator (no paid API) and verify voice file digests
        run: |
          python3 -m venv /tmp/sbc-academy-piper
          /tmp/sbc-academy-piper/bin/pip install --disable-pip-version-check --no-input piper-tts==1.3.0
          mkdir -p /tmp/sbc-academy-voice-models
          curl --fail --location --retry 3 --silent --show-error -o /tmp/sbc-academy-voice-models/en_US-lessac-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_US/lessac/medium/en_US-lessac-medium.onnx
          curl --fail --location --retry 3 --silent --show-error -o /tmp/sbc-academy-voice-models/en_US-lessac-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json
          curl --fail --location --retry 3 --silent --show-error -o /tmp/sbc-academy-voice-models/es_MX-ald-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/es/es_MX/ald/medium/es_MX-ald-medium.onnx
          curl --fail --location --retry 3 --silent --show-error -o /tmp/sbc-academy-voice-models/es_MX-ald-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/es/es_MX/ald/medium/es_MX-ald-medium.onnx.json
          echo '5efe09e69902187827af646e1a6e9d269dee769f9877d17b16b1b46eeaaf019f  /tmp/sbc-academy-voice-models/en_US-lessac-medium.onnx' | sha256sum -c
          echo '019b3803293c93e34a206dd2e53a3889209a514e786fd7144f7b70196c579b63  /tmp/sbc-academy-voice-models/es_MX-ald-medium.onnx' | sha256sum -c
          python3 -m json.tool /tmp/sbc-academy-voice-models/en_US-lessac-medium.onnx.json >/dev/null
          python3 -m json.tool /tmp/sbc-academy-voice-models/es_MX-ald-medium.onnx.json >/dev/null
          # The pinned es_MX model serializes an old Python Enum spelling. Normalize
          # this textual config value after verifying the 63 MB voice weight SHA.
          python3 - <<'PY'
          import json,pathlib
          for name in ('en_US-lessac-medium','es_MX-ald-medium'):
              path=pathlib.Path('/tmp/sbc-academy-voice-models')/(name+'.onnx.json')
              data=json.loads(path.read_text())
              if data.get('phoneme_type')=='PhonemeType.ESPEAK':
                  data['phoneme_type']='espeak'
              if data.get('phoneme_type','espeak') not in ('espeak','text'):
                  raise SystemExit('Unexpected Piper phoneme type in '+name)
              path.write_text(json.dumps(data,ensure_ascii=False))
          PY
          echo 'Welcome to SBC Academy 360.' | /tmp/sbc-academy-piper/bin/piper --model /tmp/sbc-academy-voice-models/en_US-lessac-medium.onnx --output_file /tmp/sbc-academy-en-sample.wav
          echo 'Bienvenido a la Academia 360 de SBC.' | /tmp/sbc-academy-piper/bin/piper --model /tmp/sbc-academy-voice-models/es_MX-ald-medium.onnx --output_file /tmp/sbc-academy-es-sample.wav
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 /tmp/sbc-academy-en-sample.wav
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 /tmp/sbc-academy-es-sample.wav
          /tmp/sbc-academy-piper/bin/piper --help | head -18

      - name: Test safety and exact bilingual course coverage
        run: node --test scripts/academy360-auto-media.test.cjs
      - name: Generate 12 English and 12 Spanish UI-based videos with neural narration and pictures
        env:
          SBC_ACADEMY_NEURAL_VOICE: required
          SBC_ACADEMY_PIPER_EN: /tmp/sbc-academy-voice-models/en_US-lessac-medium.onnx
          SBC_ACADEMY_PIPER_ES: /tmp/sbc-academy-voice-models/es_MX-ald-medium.onnx
        run: |
          export PATH="/tmp/sbc-academy-piper/bin:$PATH"
          node scripts/academy360-auto-media.cjs --generate
      - name: Prove neural narration, videos, screenshots and captions in both languages
        env:
          SBC_ACADEMY_NEURAL_VOICE: required
        run: node scripts/academy360-auto-media.cjs --verify
      - name: Archive the actual generated learning media
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SBC-ACADEMY-360-24-EN-ES-VIDEO-AUDIO-PHOTO-LESSONS
          path: public/academy-media/academy360/
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
      - name: Automatically bundle reviewed synthetic-only media into the source branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/academy-media/academy360 browser_public/academy-media/academy360
          if git diff --cached --quiet; then
            echo "Automatic Academy media is already identical"
          else
            git commit -m "build(academy360): automated fictional-data English Spanish video audio and photos"
            for attempt in 1 2 3; do
              git fetch origin a-sbc-master
              git rebase origin/a-sbc-master
              if git push origin HEAD:a-sbc-master; then
                echo "All generated SBC multimedia lessons integrated into the latest branch"
                exit 0
              fi
            done
            echo "Another release moved the branch; validated artifact remains available" >&2
            exit 1
          fi
