name: SBC domain extraction contract acceptance
on:
  pull_request:
    branches: [a-sbc-master]
    paths:
      - 'server.js'
      - 'routes/sbc-legacy-training-v2.cjs'
      - 'routes/sbc-square-webhook-v1.cjs'
      - 'routes/sbc-twilio-webhooks-v1.cjs'
      - 'routes/sbc-twilio-voice-v1.cjs'
      - 'test/sbc-twilio-voice-handlers.test.cjs'
      - 'scripts/sbc-domain-extraction.test.cjs'
      - '.github/workflows/sbc-domain-extraction.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --check server.js
      - run: node --test scripts/sbc-domain-extraction.test.cjs test/sbc-twilio-voice-handlers.test.cjs
