name: SBC Call Command V2 — Voice Authorization Safety
on:
  pull_request:
    branches: [a-sbc-master]
    paths:
      - 'enterprise/sbc-call-command-voice-preflight-v2.cjs'
      - 'routes/account-portfolios-v1.cjs'
      - 'enterprise/sbc-account-manager-role-gate-v2.cjs'
      - 'test/sbc-call-command-voice-preflight-v2.test.cjs'
      - '.github/workflows/sbc-call-command-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Syntax and read-only voice preflight
        run: |
          node --check enterprise/sbc-call-command-voice-preflight-v2.cjs
          node --check routes/account-portfolios-v1.cjs
          node --check enterprise/sbc-account-manager-role-gate-v2.cjs
          node --test test/sbc-call-command-voice-preflight-v2.test.cjs test/sbc-call-command-v1.test.cjs
      - name: Existing role authorization and CRM regression
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test scripts/account-manager-role-gate.test.cjs test/sbc-account-portfolios.test.cjs
