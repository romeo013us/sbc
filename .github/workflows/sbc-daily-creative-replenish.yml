name: SBC Daily Creative Replenishment
on:
  schedule:
    # 06:00 Eastern is 10:00 UTC during EDT and 11:00 UTC during EST.
    # The client checks America/New_York before making any host requests.
    - cron: '0 10,11 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sbc-creative-refill
  cancel-in-progress: false
jobs:
  refill:
    if: vars.SBC_CREATIVE_REFILL_ENABLED == 'YES' && github.ref == 'refs/heads/a-sbc-master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install free rendering tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick librsvg2-bin fonts-dejavu-core
      - name: Generate and import signed drafts
        env:
          SBC_HOST_BASE_URL: ${{ secrets.SBC_HOST_BASE_URL }}
          SBC_CREATIVE_IMPORTER_SECRET: ${{ secrets.SBC_CREATIVE_IMPORTER_SECRET }}
          SBC_CREATIVE_ED25519_PRIVATE_KEY: ${{ secrets.SBC_CREATIVE_ED25519_PRIVATE_KEY }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            node scripts/sbc-autonomous-refill-sync.cjs --scheduled
          else
            node scripts/sbc-autonomous-refill-sync.cjs
          fi
