name: SBC NVIDIA Riva actual client SDK lab
on:
  pull_request:
    branches: [a-sbc-master]
    paths:
      - 'scripts/nvidia_riva/**'
      - '.github/workflows/sbc-nvidia-riva-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  riva-client:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install isolated client and synthetic speech generator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends espeak-ng
          python -m venv "$RUNNER_TEMP/sbc-riva"
          "$RUNNER_TEMP/sbc-riva/bin/python" -m pip install --disable-pip-version-check nvidia-riva-client==2.28.0
          "$RUNNER_TEMP/sbc-riva/bin/python" -m pip check
      - name: Actual gRPC SDK with fake server and no external egress
        run: |
          sudo unshare --net -- sh -c 'ip link set lo up; exec env -i PATH=/usr/bin:/bin HOME="$1" PYTHONDONTWRITEBYTECODE=1 "$1/sbc-riva/bin/python" -m unittest discover -s scripts/nvidia_riva -p "test_*.py" -v' sh "$RUNNER_TEMP"
