name: SBC Website Studio rendered acceptance
on:
  pull_request:
    branches: [a-sbc-master]
    paths:
      - 'enterprise/website-studio/**'
      - 'scripts/sbc-website-studio-*.test.cjs'
      - 'scripts/sbc-website-studio-browser.py'
      - '.github/workflows/sbc-website-studio-rendered.yml'
  push:
    branches: [a-sbc-master]
    paths:
      - 'enterprise/website-studio/**'
      - 'scripts/sbc-website-studio-*.test.cjs'
      - 'scripts/sbc-website-studio-browser.py'
      - '.github/workflows/sbc-website-studio-rendered.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  studio-rendered:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Source and interaction regressions
        run: node --test scripts/sbc-website-studio-interactions.test.cjs scripts/sbc-website-studio-static-qa.test.cjs scripts/sbc-website-studio-multi-page.test.cjs scripts/sbc-art-directed-composer.test.cjs scripts/sbc-website-studio-v2-elite.test.cjs
      - name: Install browser test driver
        run: python -m pip install playwright==1.57.0
      - name: Render generated private concepts with blocked external requests
        run: python scripts/sbc-website-studio-browser.py
      - name: Upload synthetic rendered evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SBC-WEBSITE-STUDIO-RENDERED-ACCEPTANCE
          path: ${{ runner.temp }}/sbc-studio-browser-proof/
          retention-days: 14
