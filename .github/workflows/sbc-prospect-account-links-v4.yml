name: SBC Prospect Account Links V4 — offline account handoff
on:
  pull_request:
    branches: [a-sbc-master]
    paths:
      - 'enterprise/sbc-prospect-account-links-v4.cjs'
      - 'enterprise/sbc-website-production-routes.cjs'
      - 'enterprise/sbc-account-manager-role-gate-v2.cjs'
      - 'public/sbc-prospect-intelligence.js'
      - 'browser_public/sbc-prospect-intelligence.js'
      - 'public/sbc-account-manager-v1.js'
      - 'browser_public/sbc-account-manager-v1.js'
      - 'test/sbc-prospect-account-links-v4.test.cjs'
      - '.github/workflows/sbc-prospect-account-links-v4.yml'
  push:
    branches: [a-sbc-master]
    paths:
      - 'enterprise/sbc-prospect-account-links-v4.cjs'
      - 'test/sbc-prospect-account-links-v4.test.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  account-research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: V4 syntax and secure mirror
        run: |
          node --check enterprise/sbc-prospect-account-links-v4.cjs
          node --check public/sbc-prospect-intelligence.js
          node --check public/sbc-account-manager-v1.js
          cmp public/sbc-prospect-intelligence.js browser_public/sbc-prospect-intelligence.js
          cmp public/sbc-account-manager-v1.js browser_public/sbc-account-manager-v1.js
      - name: V4 plus V1-V3 regression suite
        run: node --test test/sbc-prospect-account-links-v4.test.cjs test/sbc-prospect-packet-library.test.cjs test/sbc-prospect-opportunity-v3.test.cjs test/sbc-prospect-workforce-v2.test.cjs test/sbc-prospect-intelligence.test.cjs
