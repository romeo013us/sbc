name: SBC Call Command V3 — Live Calling Security
on:
  pull_request:
    branches: [a-sbc-master]
    paths:
      - 'enterprise/sbc-call-command-live-v3.cjs'
      - 'routes/account-portfolios-v1.cjs'
      - 'enterprise/sbc-account-manager-role-gate-v2.cjs'
      - 'public/sbc-call-command-live-v3.js'
      - 'browser_public/sbc-call-command-live-v3.js'
      - 'test/sbc-call-command-live-v3.test.cjs'
      - '.github/workflows/sbc-call-command-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-calling-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test test/sbc-call-command-live-v3.test.cjs
      - run: node --test test/sbc-call-command-voice-preflight-v2.test.cjs test/sbc-call-command-v1.test.cjs test/sbc-account-portfolios.test.cjs scripts/account-manager-role-gate.test.cjs
