name: SBC legacy renewal tenant boundaries
on:
  pull_request:
    branches: [a-sbc-master]
    paths:
      - 'server.js'
      - 'routes/sbc-legacy-renewals-v1.cjs'
      - 'test/sbc-legacy-renewals-boundary.test.cjs'
      - '.github/workflows/sbc-legacy-renewals-boundaries.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --check server.js
      - run: node --test test/sbc-legacy-renewals-boundary.test.cjs test/sbc-renewal-center.test.cjs
