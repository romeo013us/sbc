name: SBC Financial Ledger MySQL Acceptance
on:
  pull_request:
  push:
    branches: [a-sbc-master, a-officebox-v156-godaddy-preview-20261121]
permissions:
  contents: read
jobs:
  ledger-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: sbc_ledger_disposable_ci_password
          MYSQL_DATABASE: sbc_ledger_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test shared/sbc-core/ledger.test.cjs
      - run: node --test shared/sbc-core/ledger.mysql.test.cjs
        env:
          SBC_LEDGER_DISPOSABLE_CI: '1'
          SBC_LEDGER_CI_PASSWORD: sbc_ledger_disposable_ci_password
      - run: node --test scripts/sbc-marketing-read-models-mysql.test.cjs
        env:
          SBC_LEDGER_DISPOSABLE_CI: '1'
          SBC_LEDGER_CI_PASSWORD: sbc_ledger_disposable_ci_password
      - run: node --test scripts/sbc-marketing-inventory-mysql.test.cjs
        env:
          SBC_LEDGER_DISPOSABLE_CI: '1'
          SBC_LEDGER_CI_PASSWORD: sbc_ledger_disposable_ci_password
