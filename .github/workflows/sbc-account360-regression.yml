name: SBC Account 360 and Focused UX
on:
  pull_request:
    branches: [a-sbc-master]
  push:
    branches: [a-sbc-master]
permissions:
  contents: read
jobs:
  account-profile-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:lead-accounts
      - run: node --test scripts/account-manager-ui.test.cjs test/sbc-account-revenue-v5.test.cjs
      - name: Verify Smart Calling and website demo safety
        run: |
          node --check public/sbc-smart-calling-v1.js
          node --check public/sbc-website-sales-script-v1.js
          node --check public/sbc-lead-profile-v1.js
          node --test test/sbc-smart-calling-v1.test.cjs test/sbc-website-call-desk.test.cjs test/sbc-appointment-workflow.test.cjs
