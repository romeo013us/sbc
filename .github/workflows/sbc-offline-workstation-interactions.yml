name: SBC Offline Functional Workstation Audit
on:
  pull_request:
    branches: [a-sbc-master]
    paths:
      - 'public/lead-research.html'
      - 'browser_public/lead-research.html'
      - 'public/lead-research.js'
      - 'public/sbc-account-manager-v1.js'
      - 'browser_public/sbc-account-manager-v1.js'
      - 'browser_public/sbc-lorna-handoff-v1.js'
      - 'scripts/sbc-offline-interaction-audit.py'
      - 'test/sbc-workstation-browser-wiring.test.cjs'
      - 'test/sbc-lorna-urgent-contrast.test.cjs'
      - 'public/sbc-lorna-checklist.css'
      - 'browser_public/sbc-lorna-checklist.css'
      - '.github/workflows/sbc-offline-workstation-interactions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  functional-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify production asset wiring and isolated workforce guards
        run: |
          node --test test/sbc-workstation-browser-wiring.test.cjs test/sbc-lorna-urgent-contrast.test.cjs test/sbc-lorna-one-click-handoff.test.cjs test/sbc-account-manager-fast-search.test.cjs
      - name: Install Chromium browser audit runtime
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run real JavaScript in simulated authorized workstations
        run: python scripts/sbc-offline-interaction-audit.py
      - name: Preserve screenshots and machine-readable functional results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SBC-Offline-Functional-Audit
          path: test-results/offline-functional/
          retention-days: 14
          if-no-files-found: warn
