name: SBC production verification (non-deploying)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sbc-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-regression-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      SBC_RUNTIME_ROLE: readonly
      SBC_RECOVERY_FORCE_UNLOCK: 'false'
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify packaged source compilation
        run: npm run build
      - name: Run complete repository regression suite
        run: npm run test:all
      - name: Verify explicit schema-change opt-in
        run: node scripts/v6621-explicit-ddl-optin.test.cjs
      - name: Check incident audit and background-worker regression
        run: |
          node --test ops/read-only-db-audit.test.js
          node hotfix-assets/v65134-tenant-rejection-guard-test.js
          node scripts/v6622-observable-background-gates.test.cjs
      - name: Guard against unattended order creation and unscoped revenue workers
        run: node scripts/v6623-safe-automation-quarantine.test.cjs
      - name: Verify existing-schema tenant advisory and AI checkout intent guard
        run: node scripts/v6624-existing-schema-tenant-operations.test.cjs
      - name: Verify Kim advisory never writes or crosses tenants
        run: node scripts/v6624-pure-kim-advisory.test.cjs
      - name: Gate summary
        if: always()
        run: |
          echo "These checks validate the repository, not GoDaddy production." >> "$GITHUB_STEP_SUMMARY"
          echo "No deployment, database migration, lead import, recovery override, live Twilio call, or payment test is performed." >> "$GITHUB_STEP_SUMMARY"
          echo "Production approval separately requires: backup/restore evidence, live read-only health checks, authenticated CRM smoke test, tenant isolation, writer lease, browser UX review, and deployment rollback rehearsal." >> "$GITHUB_STEP_SUMMARY"
