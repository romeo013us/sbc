name: SBC production verification (non-deploying)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sbc-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-regression-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      SBC_RUNTIME_ROLE: readonly
      SBC_RECOVERY_FORCE_UNLOCK: 'false'
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify packaged source compilation
        run: npm run build
      - name: Run complete repository regression suite
        run: npm run test:all
      - name: Verify explicit schema-change opt-in
        run: node scripts/v6621-explicit-ddl-optin.test.cjs
      - name: Check incident audit and background-worker regression
        run: |
          node --test ops/read-only-db-audit.test.js
          node hotfix-assets/v65134-tenant-rejection-guard-test.js
          node scripts/v6622-observable-background-gates.test.cjs
      - name: Guard against unattended order creation and unscoped revenue workers
        run: node scripts/v6623-safe-automation-quarantine.test.cjs
      - name: Verify existing-schema tenant advisory and AI checkout intent guard
        run: node scripts/v6624-existing-schema-tenant-operations.test.cjs
      - name: Verify Kim advisory never writes or crosses tenants
        run: node scripts/v6624-pure-kim-advisory.test.cjs
      - name: Verify lead readiness is truthful and never auto-promotes customers
        run: node scripts/v6625-lead-readiness-truth.test.cjs
      - name: Verify no delayed DOM reparenting or width rewriting
        run: node scripts/v6626-post-load-layout-single-owner.test.cjs
      - name: Verify Kim explicitly rejects unverified prospects and missing tenants
        run: node scripts/v6627-kim-eligibility-tenant-evidence.test.cjs
      - name: Verify Kim uses hydrated CRM and rejects stale customer rows
        run: node scripts/v6628-kim-canonical-db-rebind.test.cjs
      - name: Verify CSV import HTTP 200 JSON contract
        run: node scripts/v6629-import-http200-contract.test.cjs
      - name: Refuse duplicate legacy CSV importer route
        run: node scripts/v6630-disable-shadowed-legacy-import.test.cjs
      - name: Verify main dashboard cannot collapse to zero width
        run: node scripts/v6631-main-width-zero-repair.test.cjs
      - name: Verify removed floating CSV upload controls
        run: node scripts/v6632-remove-floating-lead-import.test.cjs
      - name: Verify late dashboard grid collapse regression
        run: node scripts/v6633-deferred-dashboard-grid-collapse.test.cjs
      - name: Verify immutable cache policy and all static URL revisions
        run: node scripts/v6634-versioned-asset-cache-fix.test.cjs
      - name: Verify Square checkout preflight and ambiguous payment-link handling
        run: node scripts/v6635-public-checkout-preflight-safety.test.cjs
      - name: Verify canonical stylesheet bundling and browser mirror
        run: node scripts/v6636-canonical-css-bundle.test.cjs
      - name: Enforce evidence-based Company SaaS Build scorecard logic
        run: node scripts/sbc-strict-95-release-scorecard.test.cjs
      - name: Gate summary
        if: always()
        run: |
          echo "These checks validate the repository, not GoDaddy production." >> "$GITHUB_STEP_SUMMARY"
          echo "No deployment, database migration, lead import, recovery override, live Twilio call, or payment test is performed." >> "$GITHUB_STEP_SUMMARY"
          echo "Production approval separately requires: backup/restore evidence, live read-only health checks, authenticated CRM smoke test, tenant isolation, writer lease, browser UX review, and deployment rollback rehearsal." >> "$GITHUB_STEP_SUMMARY"
