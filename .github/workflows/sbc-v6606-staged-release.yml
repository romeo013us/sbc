name: SBC V66 Quote Safe Draft — Reproducible Candidate ZIP

on:
  push:
    branches: [a-sbc-master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-staged-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify source quote and economic protections before staging
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/v6606-quote-server-hardening.cjs
          node scripts/v6606-quote-server-hardening.test.cjs
          node --check hotfix-assets/apply-v6693-quarantine-legacy-officebox.js
          node --check hotfix-assets/v6694-owner-qa-route.cjs
          node scripts/v6605-revenue-integrity.test.cjs
          node scripts/v6610-shared-margin-policy.test.cjs
          node scripts/v6612-public-prospect-privacy.test.cjs
          node scripts/v6601-ui-revenue-resilience.test.cjs
          node scripts/v6613-browser-profile-stability.test.cjs
          node scripts/v6614-quick-checkout-ui.test.cjs
          node scripts/v6616-owner-qa-nav.test.cjs
          node --check scripts/v6611-verify-stage-inventory.cjs
          node scripts/v6602-payment-evidence-contract.test.cjs
          node scripts/v6605-crm-tenant-barrier-test.js
          node scripts/v6603-flat-release-contract.test.cjs
      - name: Transform staged source only (CI disposable checkout)
        env:
          SBC_ENABLE_V6606_SOURCE_WRITE: YES
        run: |
          node scripts/v6606-quote-server-hardening.cjs --apply
          node - <<'NODE'
          const fs=require('node:fs');
          const {patchServer}=require('./hotfix-assets/apply-v6693-quarantine-legacy-officebox.js');
          const src=fs.readFileSync('server.js','utf8');
          const marker='SBC_V6693_OFFICE_BOX_LEGACY_PRECOMMIT_QUARANTINE';
          if(src.includes(marker)){
            // a-sbc-master is already compiled. Never patch it twice; assert
            // complete signed-payment, owner QA, supplier-hold and quote rails.
            const required=[
              marker,"app.post('/api/owner/launch-qa/create-order',auth,ownerOnly,",
              'QA VERIFIED - NO FULFILLMENT','sbcLaunchQaDurable',
              'SBC_V6606_QUOTE_WRITER_HARDENING','SBC_V6608_PROSPECT_CSV_PRIVACY_GATE'
            ];
            for(const token of required)if(!src.includes(token))throw Error('[SBC MASTER] partial compiled source: '+token);
            console.log('[SBC $1 QA STAGE] verified already-compiled owner route and quarantine; no reapplication');
          }else{
            const patched=patchServer(src); // exact anchors; no external calls
            fs.writeFileSync('server.js',patched);
            console.log('[SBC $1 QA STAGE] owner route and no-vendor capture protection applied to disposable source');
          }
          NODE
          SBC_RUNTIME_ROOT=. node scripts/v6694-owner-launch-qa.test.cjs
          SBC_RUNTIME_ROOT=. node scripts/v6693-compiled-officebox-quarantine.test.cjs
          node --check server.js
          node --check public/app.js
          node --check browser_public/app.js
          node --check enterprise/financial-governor-v56-25-3.js
      - name: Generate honest staged release identity (do not reuse prior receipt)
        run: |
          node - <<'NODE'
          const crypto=require('node:crypto'),fs=require('node:fs'),assert=require('node:assert/strict');
          const sha=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const identity=JSON.parse(fs.readFileSync('SBC-FLAT-RELEASE-IDENTITY.json','utf8'));
          identity.serverSha256=sha('server.js');
          identity.sourceCommit=process.env.GITHUB_SHA;
          identity.sourceFingerprint=crypto.createHash('sha256').update(JSON.stringify({
            commit:process.env.GITHUB_SHA,server:identity.serverSha256,
            finance:sha('enterprise/financial-governor-v56-25-3.js'),
            app:sha('public/app.js'),html:sha('public/index.html')
          })).digest('hex');
          identity.runtimePatch='v66.0.18-master-receipt-overlay-repair';
          identity.runtimePatchFrom='a-sbc-master';
          fs.writeFileSync('SBC-FLAT-RELEASE-IDENTITY.json',JSON.stringify(identity,null,2)+'\n');
          // GoDaddy extracts without cleaning /app. Omitting this file leaves the
          // old deployment receipt in place and causes a production rollback.
          // Rebuild a matching receipt for THIS package; it will be included
          // in the immutable staged manifest and overwrite the stale file.
          const receipt={
            sourceCommit:identity.sourceCommit,
            sourceFingerprint:identity.sourceFingerprint,
            artifactType:'server.js',
            artifactSha256:identity.serverSha256,
            buildBranch:'a-sbc-master',
            deployBranch:'a-sbc-master',
            createdBy:'SBC V66 Verified Master Release GitHub Actions'
          };
          fs.writeFileSync('SBC-DEPLOY-RECEIPT.json',JSON.stringify(receipt,null,2)+'\n');
          assert.equal(sha('server.js'),identity.serverSha256);
          assert.equal(receipt.sourceCommit,identity.sourceCommit);
          console.log('[SBC STAGED IDENTITY] release server digest and freshly regenerated receipt match');
          NODE
      - name: Build disposable flat GoDaddy ZIP and SHA256 evidence
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('.').resolve()
          out=root/'dist-stage'
          out.mkdir(exist_ok=True)
          banned={'.git','.github','node_modules','dist','dist-stage','data','backups','starter-leads','__pycache__','.pytest_cache'}
          files=[]
          for p in root.rglob('*'):
              if not p.is_file():continue
              rel=p.relative_to(root)
              if any(part in banned for part in rel.parts):continue
              if p.name=='.env' or (p.name.startswith('.env.') and p.name!='.env.example'):continue
              if p.suffix.lower() in ('.zip','.tgz','.tar','.gz','.sqlite','.db','.csv'):continue
              if rel.parts[0]=='releases':continue
              files.append(rel)
          files.sort(key=str)
          assert all(pathlib.Path(n) in files for n in ('package.json','package-lock.json','server.js','sbc-godaddy-flat-entrypoint.cjs','SBC-FLAT-RELEASE-IDENTITY.json','.airo/config.json','public/app.js'))
          # Host-mutated install metadata is deliberately not a runtime integrity input.
          excluded_inventory={'package-lock.json','SBC-FLAT-RELEASE-IDENTITY.json'}
          hashed={str(p):hashlib.sha256((root/p).read_bytes()).hexdigest() for p in files
                  if str(p) not in excluded_inventory and p.parts[0]!='.airo'}
          identity_path=root/'SBC-FLAT-RELEASE-IDENTITY.json'
          identity=json.loads(identity_path.read_text())
          manifest={'schema':1,'status':'STAGING CANDIDATE ONLY — NOT LIVE CERTIFIED',
            'sourceCommit':identity['sourceCommit'],'files':hashed}
          manifest_bytes=(json.dumps(manifest,indent=2)+'\n').encode()
          identity['stagedInventorySha256']=hashlib.sha256(manifest_bytes).hexdigest()
          identity_path.write_text(json.dumps(identity,indent=2)+'\n')
          zip_path=out/'SBC-V66-QUOTE-SAFETY-STAGING.zip'
          with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED,compresslevel=8) as z:
              for rel in files:z.write(root/rel,str(rel))
              z.writestr('SBC-STAGED-INVENTORY.json',manifest_bytes)
          (out/'SBC-V66-QUOTE-SAFETY-STAGING.zip.sha256').write_text(hashlib.sha256(zip_path.read_bytes()).hexdigest()+'  '+zip_path.name+'\n')
          with zipfile.ZipFile(zip_path) as z:
              assert z.testzip() is None
              assert 'SBC-DEPLOY-RECEIPT.json' in z.namelist(), 'Package must overwrite GoDaddy stale receipt'
              assert not any(n.lower().endswith('.csv') or n.startswith('starter-leads/') for n in z.namelist()), 'Customer prospect CSVs must never be shipped'
          assert 'SBC-DEPLOY-RECEIPT.json' in hashed, 'Receipt must be included in pinned inventory' 
          print('[SBC STAGING ZIP] '+str(len(files))+' files; fresh pinned receipt, no customer state or secrets');
          PY
      - name: Triple-check packaged server identity, revenue rules and frontend
        run: |
          set -euo pipefail
          (cd dist-stage && sha256sum -c SBC-V66-QUOTE-SAFETY-STAGING.zip.sha256)
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          unzip -q dist-stage/SBC-V66-QUOTE-SAFETY-STAGING.zip -d "$tmp"
          for pass in 1 2 3; do
            node - "$tmp" <<'NODE'
          const assert=require('node:assert/strict'),crypto=require('node:crypto'),fs=require('node:fs'),path=require('node:path');
          const root=process.argv[2],read=p=>fs.readFileSync(path.join(root,p));
          const release=JSON.parse(read('SBC-FLAT-RELEASE-IDENTITY.json').toString());
          const actual=crypto.createHash('sha256').update(read('server.js')).digest('hex');
          assert.equal(actual,release.serverSha256);
          const receipt=JSON.parse(read('SBC-DEPLOY-RECEIPT.json').toString());
          assert.equal(receipt.sourceCommit,release.sourceCommit);
          assert.equal(receipt.sourceFingerprint,release.sourceFingerprint);
          assert.equal(receipt.artifactType,'server.js');
          assert.equal(receipt.artifactSha256,actual);
          const inventory=JSON.parse(read('SBC-STAGED-INVENTORY.json').toString());
          assert.ok(inventory.files['SBC-DEPLOY-RECEIPT.json'],'Fresh receipt must be included in inventory');
          for(const [name,hash] of Object.entries(inventory.files)){
            assert.equal(crypto.createHash('sha256').update(read(name)).digest('hex'),hash,name);
          }
          const code=read('server.js').toString();
          assert.ok(code.includes('SBC_V6606_QUOTE_WRITER_HARDENING'));
          assert.ok(code.includes('PAYMENT_PROOF_REQUIRED'));
          assert.ok(code.includes('sbcV6606QuoteCreateGate'));
          assert.ok(code.includes('sbcV6606QuoteUpdateGuard'));
          assert.ok(code.includes('SBC_V6608_PROSPECT_CSV_PRIVACY_GATE'));
          assert.ok(code.includes('SBC_V6693_OFFICE_BOX_LEGACY_PRECOMMIT_QUARANTINE'));
          assert.ok(code.includes("app.post('/api/owner/launch-qa/create-order',auth,ownerOnly,"));
          assert.ok(code.includes('QA VERIFIED - NO FULFILLMENT'));
          assert.ok(code.includes('owner-verified-zero-vendor-cost'), 'QA zero-vendor-cost approval must be in compiled runtime');
          console.log('[SBC RELEASE PASS] manifest/server/quote boundaries verified');
          NODE
            node --check "$tmp/server.js"
            node --check "$tmp/public/app.js"
            node --check "$tmp/enterprise/financial-governor-v56-25-3.js"
            node "$tmp/scripts/v6611-verify-stage-inventory.cjs" "$tmp"
          done
          # Deliberate corruption must fail closed before persistent state is opened.
          printf '\nSBC_STAGING_TAMPER_PROBE\n' >> "$tmp/public/app.js"
          if node "$tmp/scripts/v6611-verify-stage-inventory.cjs" "$tmp"; then
            echo '[SBC STAGED INVENTORY] ERROR: tampering was accepted' >&2
            exit 1
          else
            echo '[SBC STAGED INVENTORY] PASS: corrupted frontend is rejected'
          fi
      - name: Prove GoDaddy overlay replaces a previous release receipt
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          # Model GoDaddy's cleanAppDirBeforeExtract:false extraction behavior.
          printf '%s\n' '{"sourceCommit":"0c6152e7aae7ad7aed33dd99d66f9f691ed57cd2","sourceFingerprint":"obsolete","artifactSha256":"obsolete"}' > "$tmp/SBC-DEPLOY-RECEIPT.json"
          unzip -oq dist-stage/SBC-V66-QUOTE-SAFETY-STAGING.zip -d "$tmp"
          node - "$tmp" <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs'),path=require('node:path');
          const root=process.argv[2],read=p=>JSON.parse(fs.readFileSync(path.join(root,p),'utf8'));
          const release=read('SBC-FLAT-RELEASE-IDENTITY.json');
          const receipt=read('SBC-DEPLOY-RECEIPT.json');
          assert.equal(receipt.sourceCommit,release.sourceCommit,'Old GoDaddy receipt was not replaced');
          assert.equal(receipt.sourceFingerprint,release.sourceFingerprint);
          assert.equal(receipt.artifactSha256,release.serverSha256);
          require(path.join(root,'scripts/v6611-verify-stage-inventory.cjs')).verifyStagedInventory(root,release);
          console.log('[SBC GODADDY OVERLAY] PASS: previous receipt overwritten with verified master identity');
          NODE
      - name: Reproduce GoDaddy production npm installation on extracted ZIP
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          unzip -q dist-stage/SBC-V66-QUOTE-SAFETY-STAGING.zip -d "$tmp"
          cd "$tmp"
          npm install --omit=dev --no-audit --no-fund
          npm run build
          node --check server.js
          node --check sbc-godaddy-flat-entrypoint.cjs
          node scripts/v6611-verify-stage-inventory.cjs .
          echo '[SBC GODADDY HOST PREFLIGHT] npm production install, build and stage integrity PASS'
      - name: Upload isolated staging candidate (never publish)
        uses: actions/upload-artifact@v4
        with:
          name: SBC-V66-QUOTE-SAFETY-STAGING-CANDIDATE
          path: |
            dist-stage/SBC-V66-QUOTE-SAFETY-STAGING.zip
            dist-stage/SBC-V66-QUOTE-SAFETY-STAGING.zip.sha256
          retention-days: 30


  # Publish only the immutable, triple-tested package to a DISTINCT GitHub branch.
  # Never update the GoDaddy-connected rollback source branch or Published app.
  github-preview-branch:
    if: github.ref == 'refs/heads/a-sbc-master' && github.event_name == 'push'
    needs: verified-staged-zip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out pinned V66 source commit
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download verified staging ZIP from this run
        uses: actions/download-artifact@v4
        with:
          name: SBC-V66-QUOTE-SAFETY-STAGING-CANDIDATE
          path: verified-runtime
      - name: Generate isolated GitHub-ready GoDaddy branch
        shell: bash
        run: |
          set -euo pipefail
          test -s verified-runtime/SBC-V66-QUOTE-SAFETY-STAGING.zip
          (cd verified-runtime && sha256sum -c SBC-V66-QUOTE-SAFETY-STAGING.zip.sha256)
          temp=$(mktemp -d)
          trap 'rm -rf "$temp"' EXIT
          unzip -q verified-runtime/SBC-V66-QUOTE-SAFETY-STAGING.zip -d "$temp"
          node scripts/v6611-verify-stage-inventory.cjs "$temp"
          node - "$temp" <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict'),crypto=require('node:crypto');
          const temp=process.argv[2];
          const id=JSON.parse(fs.readFileSync(path.join(temp,'SBC-FLAT-RELEASE-IDENTITY.json')));
          assert.equal(id.sourceCommit,process.env.GITHUB_SHA,'Only the tested commit can be published as a GitHub release candidate');
          const actual=crypto.createHash('sha256').update(fs.readFileSync(path.join(temp,'server.js'))).digest('hex');
          assert.equal(actual,id.serverSha256,'No stale compiled server');
          for(const token of ['SBC_V6606_QUOTE_WRITER_HARDENING','SBC_V6693_OFFICE_BOX_LEGACY_PRECOMMIT_QUARANTINE','SBC_V6608_PROSPECT_CSV_PRIVACY_GATE','owner-verified-zero-vendor-cost'])
            assert.ok(fs.readFileSync(path.join(temp,'server.js'),'utf8').includes(token),'Missing runtime guard: '+token);
          NODE
          # Four pinned release assets: this receipt MUST overwrite any old /app copy.
          cp "$temp/server.js" server.js
          cp "$temp/SBC-FLAT-RELEASE-IDENTITY.json" SBC-FLAT-RELEASE-IDENTITY.json
          cp "$temp/SBC-STAGED-INVENTORY.json" SBC-STAGED-INVENTORY.json
          cp "$temp/SBC-DEPLOY-RECEIPT.json" SBC-DEPLOY-RECEIPT.json
          node scripts/v6611-verify-stage-inventory.cjs .
          node --check server.js
          node --check sbc-godaddy-flat-entrypoint.cjs
          BRANCH='a-sbc-master'
          git switch -c "sbc-master-verified-$(printf '%.12s' "$GITHUB_SHA")"
          git add server.js SBC-FLAT-RELEASE-IDENTITY.json SBC-STAGED-INVENTORY.json SBC-DEPLOY-RECEIPT.json
          node - <<'NODE'
          const cp=require('node:child_process'),assert=require('node:assert/strict');
          const paths=cp.execFileSync('git',['diff','--cached','--name-only'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const allowed=new Set(['server.js','SBC-FLAT-RELEASE-IDENTITY.json','SBC-STAGED-INVENTORY.json','SBC-DEPLOY-RECEIPT.json']);
          assert.ok(paths.length>=4&&paths.every(x=>allowed.has(x)), 'Unexpected candidate branch mutation: '+paths.join(', '));
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release(godaddy): tested QA runtime from $GITHUB_SHA"
          # Fast-forward ONLY the canonical master to the verified compiled commit.
          # Reject any concurrent source edit rather than overwriting other work.
          remote=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          test "$remote" = "$GITHUB_SHA" || { echo '[SBC MASTER] source moved during build; refusing to overwrite' >&2; exit 1; }
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "### GoDaddy GitHub Preview candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "Source SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Select GoDaddy GitHub branch: $BRANCH (compiled verified master)" >> "$GITHUB_STEP_SUMMARY"
          echo "Validated: complete runtime, no stale receipt, 20% margin, owner-only QA, supplier holds." >> "$GITHUB_STEP_SUMMARY"
          echo "**No GoDaddy Preview or Published deployment occurred.**" >> "$GITHUB_STEP_SUMMARY"
