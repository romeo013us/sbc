name: SBC NVIDIA runtime and actual Relay SDK lab
on:
  pull_request:
    branches: [a-sbc-master]
    paths:
      - 'scripts/nvidia_runtime/**'
      - 'enterprise/sbc-intelligence-factory.cjs'
      - '.github/workflows/sbc-nvidia-runtime-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Runtime unit tests
        run: python -m unittest discover -s scripts/nvidia_runtime -p test_runtime.py -v
      - name: Install reviewed Relay version in isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/sbc-relay"
          "$RUNNER_TEMP/sbc-relay/bin/python" -m pip install --disable-pip-version-check nemo-relay==0.11.0
          "$RUNNER_TEMP/sbc-relay/bin/python" -m pip check
      - name: Real SDK local trace acceptance with network disabled
        run: |
          sudo unshare --net -- env -i PATH="/usr/bin:/bin" HOME="$RUNNER_TEMP" OTEL_SDK_DISABLED=true DO_NOT_TRACK=1 PYTHONDONTWRITEBYTECODE=1 SBC_NODE_BIN="$(command -v node)" "$RUNNER_TEMP/sbc-relay/bin/python" -m unittest discover -s scripts/nvidia_runtime -p test_relay.py -v
