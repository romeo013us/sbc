name: SBC Offline Reconstruction Evidence Gate

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap.js'
      - 'hotfix-assets/**'
      - 'scripts/**'
      - 'enterprise/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/sbc-isolated-reconstruction.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'docs/SBC-V66-2026-10-24-PRODUCTION-GATES-AND-CRM-ROADMAP.md'
      - 'scripts/offline-child-guard.cjs'
      - 'scripts/offline-child-guard.test.cjs'
      - 'scripts/offline-readonly-smoke-client.cjs'
      - 'scripts/v6608-real-mysql-crm-gate.cjs'
      - 'scripts/v6610-lead-workspace-browser.test.cjs'
      - 'scripts/v6612-navigation-geometry-browser.test.cjs'
      - 'scripts/v6613-payment-renderer.test.cjs'
      - 'scripts/v6616-integrated-release-gate.cjs'
      - 'scripts/v6618-real-mysql-lease-disconnect.test.cjs'
      - '.github/workflows/sbc-isolated-reconstruction.yml'
      - 'bootstrap.js'
      - 'hotfix-assets/**'
      - 'SBC-OS-V65.1.13-ROOT-FIXED-LOCKFILE-BLOCKED.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: disposable_root_ci_only
          MYSQL_DATABASE: sbc_ci_disposable
          MYSQL_USER: sbc_ci
          MYSQL_PASSWORD: disposable_user_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source checkpoint and compiler
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor bf6bd505e65bb6920ea5b2b80aff3040ae69060a HEAD
          echo 'a3241c86ab59c9242f06552ed8055b67b08daab006f96027f1cc43ed600ec159  SBC-OS-V65.1.13-ROOT-FIXED-LOCKFILE-BLOCKED.zip' | sha256sum -c -
          node --check scripts/offline-compile-release.cjs
          node --check scripts/offline-child-guard.cjs
          node scripts/offline-child-guard.test.cjs
          node scripts/manifest-identity-validator.test.js
          node scripts/runtime-build-fingerprint.test.cjs
          node scripts/prebuilt-runtime.test.cjs
          node scripts/v6638-compact-brains-kim.test.cjs
          node scripts/v6639-published-read-poll-guard.test.cjs
          node scripts/v6640-payment-evidence-and-square-preflight.test.cjs
      - name: Pre-fetch exact Twilio browser SDK (network permitted only here)
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix .sbc-twilio-sdk --no-save --ignore-scripts --no-audit --no-fund '@twilio/voice-sdk@2.18.5'
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const p=require('./.sbc-twilio-sdk/node_modules/@twilio/voice-sdk/package.json');
          const file='.sbc-twilio-sdk/node_modules/@twilio/voice-sdk/dist/twilio.min.js';
          if(p.version!=='2.18.5'||fs.statSync(file).size<100000)throw Error('Real pinned SDK not installed');
          console.log('REAL_TWILIO_SDK_SHA256='+crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex'));
          NODE
      - name: Extract frozen baseline safely into disposable directory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile,pathlib,stat
          dst=pathlib.Path('.sbc-isolated-runtime');dst.mkdir(exist_ok=False)
          z=zipfile.ZipFile('SBC-OS-V65.1.13-ROOT-FIXED-LOCKFILE-BLOCKED.zip')
          if len(z.infolist())>4000 or sum(f.file_size for f in z.infolist())>200000000:raise SystemExit('Unsafe archive size')
          for f in z.infolist():
              name=pathlib.PurePosixPath(f.filename)
              if name.is_absolute() or '..' in name.parts or stat.S_IFMT(f.external_attr>>16)==stat.S_IFLNK:raise SystemExit('Unsafe entry '+f.filename)
              if f.is_dir(): (dst/name).mkdir(parents=True,exist_ok=True)
              else:
                  (dst/name).parent.mkdir(parents=True,exist_ok=True)
                  (dst/name).write_bytes(z.read(f))
          PY
          mkdir .sbc-isolated-reports
      - name: Execute actual patch sequence in network-disabled container
        shell: bash
        run: |
          set -euo pipefail
          docker pull node:22-bookworm-slim
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --read-only --pids-limit 128 --memory 2g \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,noexec,size=64m \
            -e SBC_COMPILER_SANDBOX_CONFIRMED=1 \
            -e SBC_COMPILER_REPO=/work/repo \
            -e SBC_COMPILER_TARGET=/work/target \
            -e SBC_COMPILER_REPORTS=/work/reports \
            -e NODE_OPTIONS='--require=/work/repo/scripts/offline-child-guard.cjs' \
            -v "$PWD:/work/repo:ro" \
            -v "$PWD/.sbc-isolated-runtime:/work/target:rw" \
            -v "$PWD/.sbc-isolated-reports:/work/reports:rw" \
            node:22-bookworm-slim node /work/repo/scripts/offline-compile-release.cjs
          node - <<'NODE'
          const r=require('./.sbc-isolated-reports/offline-compile-manifest.json');
          if(r.status!=='PASSED_PATCH_AND_SYNTAX_ONLY'||r.steps.length!==82||r.postbundle_manifest_checked!==true||r.http_listen?.length!==1||r.mysql_init?.length!==1||r.http_listen[0].line>=r.mysql_init[0].line||!r.sdk_bundle_sha256)throw Error('P0 evidence gate failed');
          console.log('PATCHES',r.steps.length,'SERVER_SHA256',r.server_sha256,'HTTP_LINE',r.http_listen[0].line,'MYSQL_LINE',r.mysql_init[0].line);
          NODE
      - name: Verify compiled paid-order truth and Square no-ghost-order behavior
        shell: bash
        env:
          SBC_RUNTIME_ROOT: .sbc-isolated-runtime
        run: |
          set -euo pipefail
          node --check scripts/v6640-compiled-payment-truth.test.cjs
          node scripts/v6640-compiled-payment-truth.test.cjs

      - name: Assert unpaid orders cannot enter or alter fulfillment
        shell: bash
        env:
          SBC_RUNTIME_ROOT: .sbc-isolated-runtime
        run: |
          set -euo pipefail
          node scripts/v6641-fulfillment-payment-gate.test.cjs
      - name: Exercise compiled Kim mission tenant, payment and persistence fail-closed gates
        shell: bash
        env:
          SBC_RUNTIME_ROOT: .sbc-isolated-runtime
        run: |
          set -euo pipefail
          node scripts/v6642-kim-mission-financial-governance.test.cjs
      - name: Assert compiled Kevin veto survives restart and cannot overstate paid revenue
        shell: bash
        env:
          SBC_RUNTIME_ROOT: .sbc-isolated-runtime
        run: |
          set -euo pipefail
          node scripts/v6643-kevin-durable-owner-veto.test.cjs
      - name: Enforce frozen frontend bundle and static-asset budgets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/v6636-frontend-freeze-budget.cjs .sbc-isolated-runtime | tee .sbc-isolated-reports/v6636-frontend-budget.json
      - name: Inventory actual generated browser buttons actions and navigation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/v6637-full-ui-control-static-inventory.cjs .sbc-isolated-runtime | tee .sbc-isolated-reports/v6637-ui-control-inventory.json
      - name: Audit all compiled source files, routes and static cache invariants
        shell: bash
        env:
          SBC_AUDIT_ALL_JS: '1'
        run: |
          set -euo pipefail
          timeout --signal=TERM 180s node scripts/v6634-full-artifact-static-audit.cjs .sbc-isolated-runtime | tee .sbc-isolated-reports/v6634-full-static-audit.json
      - name: Verify caller notes, terminal states and tenant isolation in actual call-log handlers
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --read-only --pids-limit 128 --memory 2g \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,noexec,size=64m \
            -e SBC_COMPILER_SANDBOX_CONFIRMED=1 \
            -v "$PWD/.sbc-isolated-runtime:/work/target:ro" \
            node:22-bookworm-slim node /work/target/scripts/v6614-voice-call-log-integrity-test.cjs
      - name: Prove MySQL-backed call-log truthfulness and serialization of simultaneous saves
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --read-only --pids-limit 128 --memory 2g \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,noexec,size=64m \
            -e SBC_COMPILER_SANDBOX_CONFIRMED=1 \
            -v "$PWD/.sbc-isolated-runtime:/work/target:ro" \
            node:22-bookworm-slim node /work/target/scripts/v6615-call-log-durable-test.cjs
      - name: Validate integrated Payments plus Twilio production-source composition
        shell: bash
        env:
          CI: 'true'
          SBC_RUNTIME_ROLE: readonly
          SBC_RUNTIME_ROOT: .sbc-isolated-runtime
        run: |
          set -euo pipefail
          node --check scripts/v6616-integrated-release-gate.cjs
          node scripts/v6616-integrated-release-gate.cjs | tee .sbc-isolated-reports/integrated-release-gate.json
      - name: Simulate published MySQL inactivity disconnect and safe lease retry
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --read-only --pids-limit 128 --memory 2g \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,noexec,size=64m \
            -e SBC_COMPILER_SANDBOX_CONFIRMED=1 \
            -v "$PWD/.sbc-isolated-runtime:/work/target:ro" \
            node:22-bookworm-slim node /work/target/scripts/v6617-writer-lease-heartbeat-test.cjs
      - name: Prove CRM tenant isolation against synthetic cross-tenant records
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --read-only --pids-limit 128 --memory 2g \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,noexec,size=64m \
            -e SBC_COMPILER_SANDBOX_CONFIRMED=1 \
            -v "$PWD/.sbc-isolated-runtime:/work/target:ro" \
            node:22-bookworm-slim node /work/target/scripts/v6605-crm-tenant-barrier-test.js
      - name: Prove CRM edit guards and transaction rollback with synthetic data
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --read-only --pids-limit 128 --memory 2g \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,noexec,size=64m \
            -e SBC_COMPILER_SANDBOX_CONFIRMED=1 \
            -v "$PWD/.sbc-isolated-runtime:/work/target:ro" \
            node:22-bookworm-slim node /work/target/scripts/v6606-crm-edits-test.js
      - name: Check stale-write protection for simultaneous CRM editors
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --read-only --pids-limit 128 --memory 2g \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,noexec,size=64m \
            -e SBC_COMPILER_SANDBOX_CONFIRMED=1 \
            -v "$PWD/.sbc-isolated-runtime:/work/target:ro" \
            node:22-bookworm-slim node /work/target/scripts/v6607-lead-revision-test.js
      - name: Install locked runtime dependencies for disposable smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix .sbc-isolated-runtime --ignore-scripts --no-audit --no-fund
      - name: Verify signed Twilio dialing callbacks and owner-only read-only launch diagnostics
        shell: bash
        run: |
          set -euo pipefail
          node --check .sbc-isolated-runtime/scripts/v6619-launch-security-test.cjs
          node .sbc-isolated-runtime/scripts/v6619-launch-security-test.cjs | tee .sbc-isolated-reports/signed-voice-launch-gate.json
      - name: Verify immutable tenant scope and field whitelist on legacy CRM endpoints
        shell: bash
        run: |
          set -euo pipefail
          node --check .sbc-isolated-runtime/scripts/v6620-legacy-crm-tenant-guard-test.cjs
          node .sbc-isolated-runtime/scripts/v6620-legacy-crm-tenant-guard-test.cjs | tee .sbc-isolated-reports/legacy-crm-tenant-guard.json
      - name: Smoke test actual HTTP boot with no credentials or network
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --read-only --pids-limit 128 --memory 2g \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,noexec,size=64m \
            -e SBC_COMPILER_SANDBOX_CONFIRMED=1 \
            -e SBC_COMPILER_TARGET=/work/target \
            -e SBC_COMPILER_REPORTS=/work/reports \
            -e SBC_RUNTIME_ROLE=readonly \
            -e ENABLE_DDL=false \
            -e SBC_KIM_AUTONOMOUS_MODE=off \
            -e NODE_ENV=test \
            -e PORT=18777 \
            -e NODE_OPTIONS='--require=/work/repo/scripts/offline-child-guard.cjs' \
            -v "$PWD:/work/repo:ro" \
            -v "$PWD/.sbc-isolated-runtime:/work/target:rw" \
            -v "$PWD/.sbc-isolated-reports:/work/reports:rw" \
            node:22-bookworm-slim bash -euc '
              cd /work/target
              node server.js > /work/reports/readonly-server.log 2>&1 &
              server_pid=$!
              trap "kill $server_pid 2>/dev/null || true" EXIT
              node /work/repo/scripts/offline-readonly-smoke-client.cjs
            '
      - name: Exercise production CRM handlers against disposable MySQL 8
        shell: bash
        env:
          CI: 'true'
          SBC_MYSQL_CI_DISPOSABLE: 'yes'
          SBC_RUNTIME_ROLE: readonly
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_DATABASE: sbc_ci_disposable
          MYSQL_USER: sbc_ci
          MYSQL_PASSWORD: disposable_user_ci_only
        run: |
          set -euo pipefail
          cp scripts/v6608-real-mysql-crm-gate.cjs .sbc-isolated-runtime/scripts/
          node --check .sbc-isolated-runtime/scripts/v6608-real-mysql-crm-gate.cjs
          node .sbc-isolated-runtime/scripts/v6608-real-mysql-crm-gate.cjs | tee .sbc-isolated-reports/real-mysql-crm-gate.json
      - name: Verify writer advisory lease survives MySQL socket turnover without concurrent owner
        shell: bash
        env:
          CI: 'true'
          SBC_MYSQL_CI_DISPOSABLE: 'yes'
          SBC_RUNTIME_ROLE: readonly
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_DATABASE: sbc_ci_disposable
          MYSQL_USER: sbc_ci
          MYSQL_PASSWORD: disposable_user_ci_only
        run: |
          set -euo pipefail
          cp scripts/v6618-real-mysql-lease-disconnect.test.cjs .sbc-isolated-runtime/scripts/
          node --check .sbc-isolated-runtime/scripts/v6618-real-mysql-lease-disconnect.test.cjs
          node .sbc-isolated-runtime/scripts/v6618-real-mysql-lease-disconnect.test.cjs | tee .sbc-isolated-reports/real-mysql-writer-lease.json
      - name: Render real Payments page with missing and unsafe Square links
        shell: bash
        env:
          SBC_RUNTIME_ROOT: .sbc-isolated-runtime
        run: |
          set -euo pipefail
          node --check scripts/v6613-payment-renderer.test.cjs
          node scripts/v6613-payment-renderer.test.cjs | tee .sbc-isolated-reports/payment-renderer.json
      - name: Test reconstructed Lead Workspace in real Chromium with synthetic API
        shell: bash
        env:
          CI: 'true'
          SBC_RUNTIME_ROLE: readonly
        run: |
          set -euo pipefail
          npm install --prefix .sbc-browser --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          ./.sbc-browser/node_modules/.bin/playwright install --with-deps chromium
          SBC_BROWSER_ASSET_ROOT="$PWD/.sbc-isolated-runtime" \
          SBC_PLAYWRIGHT_PATH="$PWD/.sbc-browser/node_modules/playwright" \
          timeout --signal=TERM 120s node scripts/v6610-lead-workspace-browser.test.cjs | tee .sbc-isolated-reports/lead-workspace-browser.json
      - name: Verify real SBC shell never hangs on CRM 503 or blocked browser storage
        shell: bash
        env:
          CI: 'true'
          SBC_RUNTIME_ROLE: readonly
        run: |
          set -euo pipefail
          SBC_BROWSER_ASSET_ROOT="$PWD/.sbc-isolated-runtime" \
          SBC_PLAYWRIGHT_PATH="$PWD/.sbc-browser/node_modules/playwright" \
          timeout --signal=TERM 90s node scripts/v6638-browser-boot-failsafe.test.cjs | tee .sbc-isolated-reports/v6638-shell-boot.json
      - name: Verify desktop and mobile navigation geometry in Chromium
        shell: bash
        env:
          CI: 'true'
          SBC_RUNTIME_ROLE: readonly
        run: |
          set -euo pipefail
          SBC_BROWSER_ASSET_ROOT="$PWD/.sbc-isolated-runtime" \
          SBC_PLAYWRIGHT_PATH="$PWD/.sbc-browser/node_modules/playwright" \
          timeout --signal=TERM 90s node scripts/v6612-navigation-geometry-browser.test.cjs | tee .sbc-isolated-reports/navigation-geometry.json
      - name: Verify dashboard remains stable after 3.5 seconds of deferred mounts
        shell: bash
        env:
          CI: 'true'
          SBC_RUNTIME_ROLE: readonly
        run: |
          set -euo pipefail
          SBC_BROWSER_ASSET_ROOT="$PWD/.sbc-isolated-runtime" \
          SBC_PLAYWRIGHT_PATH="$PWD/.sbc-browser/node_modules/playwright" \
          timeout --signal=TERM 60s node scripts/v6626-delayed-layout-browser.test.cjs | tee .sbc-isolated-reports/delayed-layout-browser.json
      - name: Verify 10-second deferred production dashboard does not collapse to 12 narrow columns
        shell: bash
        env:
          CI: 'true'
          SBC_RUNTIME_ROLE: readonly
        run: |
          set -euo pipefail
          SBC_BROWSER_ASSET_ROOT="$PWD/.sbc-isolated-runtime" \
          SBC_PLAYWRIGHT_PATH="$PWD/.sbc-browser/node_modules/playwright" \
          timeout --signal=TERM 75s node scripts/v6633-ten-second-dashboard-browser.test.cjs | tee .sbc-isolated-reports/ten-second-grid.json
      - name: Compare canonical CSS bundle against all 67 original styles in Chromium
        shell: bash
        env:
          CI: 'true'
          SBC_RUNTIME_ROLE: readonly
        run: |
          set -euo pipefail
          SBC_BROWSER_ASSET_ROOT="$PWD/.sbc-isolated-runtime" \
          SBC_PLAYWRIGHT_PATH="$PWD/.sbc-browser/node_modules/playwright" \
          timeout --signal=TERM 90s node scripts/v6636-css-parity-browser.test.cjs | tee .sbc-isolated-reports/v6636-css-parity.json
      - name: Package verified prebuilt runtime after full isolated acceptance
        shell: bash
        env:
          CI: 'true'
          SBC_PREBUILT_ISOLATED: '1'
        run: |
          set -euo pipefail
          node --check scripts/prebuilt-runtime.cjs
          node --check scripts/package-prebuilt-runtime.cjs
          node scripts/package-prebuilt-runtime.cjs
          unzip -t SBC-V66-PREBUILT-RUNTIME.zip
          unzip -Z1 SBC-V66-PREBUILT-RUNTIME.zip | grep -qx 'server.js'
          unzip -Z1 SBC-V66-PREBUILT-RUNTIME.zip | grep -qx 'public/index.html'
          unzip -Z1 SBC-V66-PREBUILT-RUNTIME.zip | grep -qx 'browser_public/index.html'
          if unzip -Z1 SBC-V66-PREBUILT-RUNTIME.zip | grep -Eq '^(data/|backups/|node_modules/|.env)'; then
            echo 'Unsafe runtime or customer data included in release archive' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SBC-VERIFIED-PREBUILT-RUNTIME
          path: |
            SBC-V66-PREBUILT-RUNTIME.zip
            SBC-V66-PREBUILT-RUNTIME.json
          if-no-files-found: error
          retention-days: 14
      - name: Create source candidate with authentic cached SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          rsync -a --exclude='.git' --exclude='.sbc-browser' --exclude='.sbc-isolated-runtime' --exclude='.sbc-isolated-reports' --exclude='release' --exclude='node_modules' ./ release/
          rsync -a .sbc-twilio-sdk/ release/.sbc-twilio-sdk/
          test -s release/.sbc-twilio-sdk/node_modules/@twilio/voice-sdk/dist/twilio.min.js
          cd release
          zip -qr ../SBC-V66-OFFLINE-RECONSTRUCTED-CANDIDATE.zip .
          cd ..
          sha256sum SBC-V66-OFFLINE-RECONSTRUCTED-CANDIDATE.zip > .sbc-isolated-reports/archive.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SBC-P0-EVIDENCE-AND-CANDIDATE
          path: |
            .sbc-isolated-reports/
            SBC-V66-OFFLINE-RECONSTRUCTED-CANDIDATE.zip
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

  publish-prebuilt-to-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [offline-reconstruct]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: SBC-VERIFIED-PREBUILT-RUNTIME
          path: .
      - name: Validate source identity and archive before publishing
        shell: bash
        run: |
          set -euo pipefail
          node -e "require('./scripts/prebuilt-runtime.cjs').readManifest(process.cwd()) || process.exit(9)"
          git fetch origin main
          if test "$(git rev-parse origin/main)" != "$GITHUB_SHA"; then
            echo 'New main commit exists; refuse to publish stale generated source.'
            exit 1
          fi
      - name: Commit fully tested prebuilt release to GoDaddy main source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f SBC-V66-PREBUILT-RUNTIME.zip SBC-V66-PREBUILT-RUNTIME.json
          if git diff --cached --quiet; then
            echo "Verified release already matches source"
            exit 0
          fi
          git commit -m "build: ship fully tested prebuilt V66 runtime for GoDaddy"
          git push origin HEAD:main
