name: SBC Root Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Check bootstrap and navigation patch syntax
        run: |
          node --check bootstrap.js
          node scripts/v6638-compact-brains-kim.test.cjs
          node scripts/v6639-published-read-poll-guard.test.cjs
          node scripts/v6640-payment-evidence-and-square-preflight.test.cjs
          node scripts/prebuilt-runtime.test.cjs
          node scripts/runtime-build-fingerprint.test.cjs
          node --check hotfix-assets/apply-v6600-release-layout.js
          node --check hotfix-assets/apply-v6574-draggable-nav-rail.js
          node --check hotfix-assets/v6574-draggable-nav-rail.js
          node --check hotfix-assets/v6574-draggable-nav-rail-test.js

      - name: Verify generated runtime and manifest
        run: npm run build

      - name: Run full regression suite
        run: npm run test:all

      - name: Run standalone legacy-entrypoint compatibility suite against V66 replacements
        run: node scripts/legacy-standalone-suite.test.js
