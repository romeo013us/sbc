name: Fantastic 4 Contract and Readiness Safety
on:
  pull_request:
    branches: [main]
    paths:
      - 'ecosystem/fantastic4-*'
      - 'scripts/fantastic4-*'
      - 'docs/FANTASTIC4-*'
      - 'website/legal/**'
      - '.github/workflows/fantastic4-readiness-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-false-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/fantastic4-readiness.cjs
      - run: node scripts/fantastic4-readiness.test.cjs
      - name: Unverified production evidence MUST be NO_GO
        shell: bash
        run: |
          set +e
          node scripts/fantastic4-readiness.cjs > /tmp/fantastic4-readiness.json
          exit_code=$?
          set -e
          test "$exit_code" -eq 2
          node -e "const v=require('/tmp/fantastic4-readiness.json'); if(v.status!=='NO_GO')process.exit(1);"
      - run: node scripts/office-box-paid-handoff.test.cjs
