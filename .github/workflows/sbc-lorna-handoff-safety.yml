name: SBC Lorna → Account Manager Handoff Safety
on:
  pull_request:
    branches: [a-sbc-master]
    paths:
      - 'enterprise/sbc-lorna-handoff-v1.cjs'
      - 'public/sbc-lorna-handoff-v1.js'
      - 'browser_public/sbc-lorna-handoff-v1.js'
      - 'test/sbc-lorna-handoff-safety-ux.test.cjs'
      - 'scripts/lorna-account-handoff.test.cjs'
      - 'scripts/lorna-account-routes.test.cjs'
      - '.github/workflows/sbc-lorna-handoff-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handoff-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate safety and mirror integrity
        run: |
          node --check enterprise/sbc-lorna-handoff-v1.cjs
          node --check public/sbc-lorna-handoff-v1.js
          cmp public/sbc-lorna-handoff-v1.js browser_public/sbc-lorna-handoff-v1.js
      - name: Handoff, tenant and suppression behavior
        run: node --test test/sbc-lorna-handoff-safety-ux.test.cjs scripts/lorna-account-handoff.test.cjs scripts/lorna-account-routes.test.cjs scripts/lorna-account-mysql.test.cjs
