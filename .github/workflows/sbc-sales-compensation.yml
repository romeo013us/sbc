name: SBC Sales Compensation Safety
on:
  push:
    paths:
      - 'enterprise/sbc-sales-compensation-v1.cjs'
      - 'enterprise/sbc-sales-hiring-scorecard-v1.cjs'
      - 'scripts/sbc-sales-hiring-scorecard-v1.test.cjs'
      - 'routes/sbc-sales-command-v1.cjs'
      - 'public/v32-2-upgrade.js'
      - 'browser_public/v32-2-upgrade.js'
      - 'scripts/sbc-v66161-nav-and-public-discovery.test.cjs'
      - 'scripts/sbc-v66162-ops-revenue-truth.test.cjs'
      - 'package.json'
      - 'scripts/sbc-sales-compensation-v1.test.cjs'
      - 'scripts/sbc-sales-command-routes.test.cjs'
      - 'scripts/sbc-sales-approval-recheck.test.cjs'
      - 'scripts/sbc-sales-acceptance-war.test.cjs'
      - 'scripts/sbc-sales-readiness.test.cjs'
      - 'scripts/sbc-sales-readiness-ui.test.cjs'
      - 'scripts/v66160-stage-sales-command.cjs'
      - 'migrations/20261122_001_sbc_sales_command.sql'
      - '.github/workflows/sbc-sales-compensation.yml'
  pull_request:
    paths:
      - 'enterprise/sbc-sales-compensation-v1.cjs'
      - 'routes/sbc-sales-command-v1.cjs'
      - 'public/v32-2-upgrade.js'
      - 'browser_public/v32-2-upgrade.js'
      - 'scripts/sbc-v66161-nav-and-public-discovery.test.cjs'
      - 'scripts/sbc-v66162-ops-revenue-truth.test.cjs'
      - 'package.json'
      - 'scripts/sbc-sales-compensation-v1.test.cjs'
      - 'scripts/sbc-sales-command-routes.test.cjs'
      - 'scripts/sbc-sales-approval-recheck.test.cjs'
      - 'scripts/sbc-sales-acceptance-war.test.cjs'
      - 'scripts/sbc-sales-readiness.test.cjs'
      - 'scripts/sbc-sales-readiness-ui.test.cjs'
      - 'scripts/v66160-stage-sales-command.cjs'
      - '.github/workflows/sbc-sales-compensation.yml'
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:sales-command
      - run: node scripts/v66160-stage-sales-command.cjs
