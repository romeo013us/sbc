name: SBC Pre-Marketing Readiness (Static)
on:
  push:
    branches: [a-sbc-master, main]
    paths:
      - 'public/**'
      - 'package.json'
      - 'scripts/sbc-prelaunch-readiness.cjs'
      - 'test/sbc-prelaunch-readiness.test.cjs'
      - '.github/workflows/sbc-prelaunch-readiness.yml'
  pull_request:
    paths:
      - 'public/**'
      - 'package.json'
      - 'scripts/sbc-prelaunch-readiness.cjs'
      - 'test/sbc-prelaunch-readiness.test.cjs'
      - '.github/workflows/sbc-prelaunch-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-readiness:
    name: Node 22 · no-secrets static assets and private staff indexing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
      - uses: actions/setup-node@49933ea5288ca8642d1e84afbd3f7d6820020 # v4 pinned
        with:
          node-version: '22'
      - run: node --test test/sbc-prelaunch-readiness.test.cjs
      - run: node scripts/sbc-prelaunch-readiness.cjs
