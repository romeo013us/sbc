name: SBC protected promotion preflight
on:
  workflow_dispatch:
    inputs:
      expected_base_sha:
        description: Current sealed a-sbc-master SHA
        required: true
        type: string
      tested_source_sha:
        description: Reviewed candidate source SHA
        required: true
        type: string
      staging_run_id:
        description: Exact successful candidate staging run ID
        required: true
        type: string
      expected_sealed_sha:
        description: Independently reviewed sealed recovery commit SHA
        required: true
        type: string
      review_pr:
        description: Exact candidate pull request number
        required: true
        type: string
      promote:
        description: Request protected promotion (disabled unless cutover enabled)
        required: true
        default: false
        type: boolean
  pull_request:
    branches: [a-sbc-master]
    paths:
      - '.github/workflows/sbc-protected-promotion-preflight.yml'
      - 'scripts/verify-staging-evidence.cjs'
      - 'test/sbc-staging-evidence.test.cjs'
      - 'scripts/verify-promotion-ci.cjs'
      - 'scripts/verify-protected-promotion.sh'
      - 'test/sbc-promotion-ci.test.cjs'
      - 'scripts/promote-sealed-master.sh'
permissions:
  contents: read
  actions: read
jobs:
  evidence-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test test/sbc-staging-evidence.test.cjs test/sbc-promotion-ci.test.cjs test/sbc-atomic-promotion.test.cjs
      - run: bash -n scripts/verify-protected-promotion.sh
  preflight:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/a-sbc-master'
    needs: evidence-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify exact run and sealed recovery tree (read only)
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BASE: ${{ inputs.expected_base_sha }}
          TESTED_SOURCE: ${{ inputs.tested_source_sha }}
          EXPECTED_SEAL: ${{ inputs.expected_sealed_sha }}
          STAGING_RUN: ${{ inputs.staging_run_id }}
          REVIEW_PR: ${{ inputs.review_pr }}
        run: bash scripts/verify-protected-promotion.sh
  promote:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/a-sbc-master' && inputs.promote && vars.SBC_ATOMIC_PROMOTION_ENABLED == 'true'
    needs: preflight
    environment: sbc-release-promoter
    concurrency:
      group: sbc-protected-master-promotion
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Recheck evidence after protected approval
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BASE: ${{ inputs.expected_base_sha }}
          TESTED_SOURCE: ${{ inputs.tested_source_sha }}
          EXPECTED_SEAL: ${{ inputs.expected_sealed_sha }}
          STAGING_RUN: ${{ inputs.staging_run_id }}
          REVIEW_PR: ${{ inputs.review_pr }}
        run: bash scripts/verify-protected-promotion.sh
      - name: Promote only the reviewed sealed ref using dedicated release actor
        env:
          PROMOTER_CREDENTIAL: ${{ secrets.SBC_RELEASE_PROMOTER_CREDENTIAL }}
          EXPECTED_BASE: ${{ inputs.expected_base_sha }}
          TESTED_SOURCE: ${{ inputs.tested_source_sha }}
          EXPECTED_SEAL: ${{ inputs.expected_sealed_sha }}
        run: |
          set -euo pipefail
          test -n "$PROMOTER_CREDENTIAL"
          [[ "$EXPECTED_BASE" =~ ^[0-9a-f]{40}$ && "$TESTED_SOURCE" =~ ^[0-9a-f]{40}$ && "$EXPECTED_SEAL" =~ ^[0-9a-f]{40}$ ]]
          trusted="$PWD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          git fetch --no-tags origin "refs/heads/release/verified-godaddy-$TESTED_SOURCE"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SEAL"
          temp=$(mktemp -d)
          trap 'git -C "$trusted" worktree remove --force "$temp/tree" 2>/dev/null || true; rm -rf "$temp"' EXIT
          git worktree add --detach "$temp/tree" "$EXPECTED_SEAL"
          node scripts/verify-release-sync.cjs "$temp/tree" "$TESTED_SOURCE"
          header=$(printf 'x-access-token:%s' "$PROMOTER_CREDENTIAL" | base64 -w0)
          echo "::add-mask::$header"
          unset PROMOTER_CREDENTIAL
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0=
          export GIT_CONFIG_KEY_1=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_1="AUTHORIZATION: basic $header"
          export SBC_TRUSTED_RELEASE_VERIFIER="$trusted/scripts/verify-release-sync.cjs"
          cd "$temp/tree"
          bash "$trusted/scripts/promote-sealed-master.sh" "$EXPECTED_BASE" "$TESTED_SOURCE"
          test "$(git ls-remote origin refs/heads/a-sbc-master | cut -f1)" = "$EXPECTED_SEAL"
          bash "$trusted/scripts/advance-verified-preview.sh" "$TESTED_SOURCE"
          test "$(git ls-remote origin refs/heads/deploy/godaddy-verified-preview | cut -f1)" = "$EXPECTED_SEAL"
          echo "Sealed Git refs verified: $EXPECTED_SEAL. No GoDaddy deployment occurred." >> "$GITHUB_STEP_SUMMARY"
