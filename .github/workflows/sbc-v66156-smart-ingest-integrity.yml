name: SBC V66 Smart Lead Import Integrity
on:
  push:
    branches: [a-sbc-master, sbc-v66156-smart-ingest-integrity]
    paths:
      - routes/v56131-revenue-finisher.js
      - scripts/v66156-smart-ingest-integrity.test.cjs
      - .github/workflows/sbc-v66156-smart-ingest-integrity.yml
  pull_request:
    branches: [a-sbc-master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smart-ingest-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/v66156-smart-ingest-integrity.test.cjs
      - run: node --test test/crm-text-integrity-v66140.test.cjs
      - run: node --check routes/v56131-revenue-finisher.js
