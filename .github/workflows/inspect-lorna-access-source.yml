name: Inspect Lorna Access Source
on:
  push:
    branches: ['chore/lorna-access-audit']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect embedded application source without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          echo '--- ROOT PACKAGE KEY FILES ---'
          unzip -l SBC-OS-V65.1.13-ROOT-FIXED-LOCKFILE-BLOCKED.zip | grep -E '(^|/)(server\.js|index\.html|sw\.js|package\.json)$' | head -100
          mkdir -p /tmp/sbc-source
          unzip -q SBC-OS-V65.1.13-ROOT-FIXED-LOCKFILE-BLOCKED.zip -d /tmp/sbc-source
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('/tmp/sbc-source')
          files=[p for p in root.rglob('*') if p.is_file() and p.suffix in ('.js','.html')]
          print('SOURCE FILE COUNT',len(files))
          server=root/'server.js'
          if server.exists():
            lines=server.read_text(errors='ignore').splitlines()
            for lo,hi in [(2418,2470),(2480,2525)]:
              print(f'--- SERVER CONTEXT {lo}-{hi} ---')
              for i in range(lo-1,min(hi,len(lines))): print(f'{i+1}: {lines[i][:1200]}')
          html=root/'public/index.html'
          if html.exists():
            lines=html.read_text(errors='ignore').splitlines()
            print('--- MAIN HTML NAV/ROLE CONTEXT ---')
            count=0
            for i,line in enumerate(lines):
              if re.search(r'nav|sidebar|lead_researcher|Users & Security|Payments|Settings|Training|Time Clock|Lead Research|Fulfillment|Finance|Dashboard|Onboarding|employees|data-page',line,re.I):
                print(f'public/index.html:{i+1}: {line[:1200]}')
                count+=1
                if count>=100: break
          patterns=[
            ('AUTH',r'function auth|const auth\s*=|let auth\s*=|function ownerOnly|const ownerOnly\s*='),
            ('ROLE',r'lead_researcher|lead_generator|researcher|prospector|ownerOnly|role ===|role==='),
            ('NAV',r'Employees|Users & Security|Payments|Refund|Settings|Training|Time Clock|Lead Research|Fulfillment|Finance|Dashboard|Onboarding'),
            ('API',r'app\.(?:get|post|put|patch|delete)\s*\(\s*[\'\"]/(?:api|admin|ops)')
          ]
          for label,pat in patterns:
            print('---',label,'---')
            count=0
            for p in files:
              try: lines=p.read_text(errors='ignore').splitlines()
              except: continue
              for i,line in enumerate(lines):
                if re.search(pat,line,re.I):
                  print(f'{p.relative_to(root)}:{i+1}: {line[:900]}')
                  count+=1
                  if count>=80: break
              if count>=80: break
            print('MATCHES_SHOWN',count)
          PY
