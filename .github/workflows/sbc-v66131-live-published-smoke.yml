name: SBC Fantastic 4 Published Smoke (read-only)
on:
  push:
    branches: [a-sbc-master]
  pull_request:
    branches: [a-sbc-master]
    paths:
      - 'scripts/v66131-*'
      - '.github/workflows/sbc-v66131-live-published-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-public-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout immutable workflow source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test operational readiness evidence policy
        run: node --test scripts/v66131-operational-readiness.test.cjs
      - name: Check no-mutation smoke contract
        run: |
          python3 scripts/v66131-published-f4-smoke.py --self-test
          python3 - <<'PY'
          from pathlib import Path
          import ast
          s=Path('scripts/v66131-published-f4-smoke.py').read_text()
          ast.parse(s)
          assert 'Request(' in s and 'method="GET"' in s
          assert 'SQUARE_ACCESS_TOKEN' not in s and 'STRIPE_SECRET_KEY' not in s
          assert 'Authorization' not in s and 'Cookie' not in s
          print('Read-only outbound smoke contract PASS')
          PY
      - name: Check GoDaddy Published public health and current UI
        run: python3 scripts/v66131-published-f4-smoke.py
      - name: Distinguish public availability from operational readiness
        if: always()
        env:
          SBC_EXPECT_CC: ${{ vars.SBC_EXPECT_CC }}
          SBC_EXPECT_OFFICE: ${{ vars.SBC_EXPECT_OFFICE }}
          SBC_EXPECT_SITE: ${{ vars.SBC_EXPECT_SITE }}
        run: node scripts/v66131-operational-readiness.cjs f4-published-smoke-results.json
      - name: Preserve exact safe results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbc-f4-published-public-smoke
          path: |
            f4-published-smoke-results.json
            f4-operational-readiness.json
          if-no-files-found: warn
          retention-days: 30
