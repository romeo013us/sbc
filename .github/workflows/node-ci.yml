name: SBC Node CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test baseline-gated DDL unblock
        run: npm run test:v6545-baseline-gated-ddl-unblock
      - name: Verify complete deployment bundle
        run: npm run build
