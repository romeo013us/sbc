name: SBC Node CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test Stark Cinematic Cockpit patch
        run: npm run test:v6554-stark-cockpit
      - name: Test God-Tier theme contrast, HUD motion, and shortcut cleanup
        run: npm run test:v6555-theme-contrast
      - name: Test Twilio Voice SDK v2 local bundle and call API
        run: npm run test:v6556-voice-sdk
      - name: Test owner recovery force-unlock and operational gate clearing
        run: npm run test:v6557-owner-force-unlock
      - name: Verify complete SBC release build
        run: npm run build
      - name: Test baseline-gated DDL unblock
        run: npm run test:v6545-baseline-gated-ddl-unblock
      - name: Test release identity alignment
        run: npm run test:v6546-release-identity-current-version
      - name: Test lead-import cache and commit contract
        run: npm run test:v6548-import-cache-fix
      - name: Verify complete deployment bundle
        run: npm run build
