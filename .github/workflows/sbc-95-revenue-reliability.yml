name: SBC 9.5 Revenue and Reliability Audit

on:
  push:
    branches:
      - audit/95-revenue-proof-20261029
  pull_request:
    branches:
      - a-sbc-rollback-oct27

permissions:
  contents: read

jobs:
  ui-and-money:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: JavaScript syntax check of runtime and UI
        run: |
          node --check server.js
          node --check public/app.js
          node --check browser_public/app.js
          node --check public/sbc-customer360-workspace-v6525.js
          node --check browser_public/sbc-customer360-workspace-v6525.js
      - name: Recent quote-save and light-mode regression
        run: node scripts/v6601-ui-revenue-resilience.test.cjs
      - name: Source-level economic and payment evidence contract
        run: node scripts/v6602-payment-evidence-contract.test.cjs
      - name: Existing theme safety regression
        run: node hotfix-assets/v6555-theme-contrast-test.js

  auth-and-tenant:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Session security
        run: node scripts/v65112-auth-session-safety-test.js
      - name: CRM tenant isolation
        run: node scripts/v6605-crm-tenant-barrier-test.js
      - name: Legacy CRM tenant guards
        run: node scripts/v6620-legacy-crm-tenant-guard-test.cjs
      - name: Tenant repository isolation
        run: node scripts/tenant-repository-isolation-test.js

  writer-and-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Writer lease heartbeat
        run: node scripts/v6617-writer-lease-heartbeat-test.cjs
      - name: MySQL writer lease lifecycle
        run: node hotfix-assets/v6564-mysql-lease-lifecycle-test.js
      - name: Lease session verification
        run: node hotfix-assets/v6570-lease-session-verification-test.js
      - name: Economic control non-writer DDL block
        run: node hotfix-assets/v6558-economic-control-ddl-gate-test.js
      - name: Recovery data preservation
        run: node scripts/data-recovery-guard-test.js

  security-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: SBC existing static security audit
        run: node scripts/security-check.js
      - name: Existing runtime integrity tests
        run: node scripts/runtime-integrity-test.js
      - name: Verify release package scripts
        run: npm run build
