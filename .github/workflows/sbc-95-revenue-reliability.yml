name: SBC 9.5 Revenue and Reliability Audit

on:
  push:
    branches:
      - audit/95-revenue-proof-20261029
      - a-sbc-master
  pull_request:
    branches:
      - a-sbc-rollback-oct27
      - a-sbc-master

permissions:
  contents: read

jobs:
  ui-and-money:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: JavaScript syntax check of runtime and UI
        run: |
          node --check server.js
          node --check public/app.js
          node --check enterprise/kim-demo-director.js
          node --check enterprise/sbc-site-design-engine.js
          node --check enterprise/sbc-demo-interactive-v1.js
          node --check public/sbc-demo-interactive-v1.js
          node scripts/v66113-free-smart-demos.test.cjs
          node scripts/v66115-dropzone-launch-truth.test.cjs
          node scripts/v66117-print-desk.test.cjs
          node scripts/v66117-stage-print-desk-ui.cjs
          node scripts/v66118-master-release-parity.test.cjs
          node scripts/v66119-publisher-inline-js-syntax.test.cjs
          node --check enterprise/v66117-print-fulfillment-truth.cjs
          node --check browser_public/app.js
          node --check public/sbc-customer360-workspace-v6525.js
          node --check browser_public/sbc-customer360-workspace-v6525.js
      - name: Check dashboard assets, handlers and API routes
        run: npm run audit:ui
      - name: Block high severity production dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Recent quote-save and light-mode regression
        run: node scripts/v6601-ui-revenue-resilience.test.cjs
      - name: Browser profile/role stability no-reload regression
        run: node scripts/v6613-browser-profile-stability.test.cjs
      - name: Quick checkout and protected owner dollar-QA UI proof
        run: |
          node scripts/v6614-quick-checkout-ui.test.cjs
          node scripts/v6625-square-qa-link-reconcile.test.cjs
          node scripts/v6616-owner-qa-nav.test.cjs
          node scripts/v6621-launch-acceptance.test.cjs
          node scripts/v6622-phase2-4-contracts.test.cjs
          node scripts/v6623-login-access.test.cjs
          node scripts/v6630-customer-journey.test.cjs
          node scripts/v6631-legacy-journey-contract.test.cjs
          node scripts/v6670-quote-order-journey.test.cjs
          node scripts/v6671-square-webhook-readback.test.cjs
          node scripts/v6672-site-checkout.test.cjs
          node scripts/v6674-officebox-v2-handoff.test.cjs
          node scripts/v66120-officebox-commerce-boundary.test.cjs
          node scripts/v66122-central-square-officebox-guard.test.cjs
          node scripts/v66123-activity-text-safety.test.cjs
          node scripts/v66126-crm-audit-safe.test.cjs
          node scripts/v66127-signed-federation-probe.test.cjs
          node scripts/v66128-owner-while-away.test.cjs
          node scripts/v66129-owner-checkout-lab.test.cjs
          node scripts/v66132-nextday-outbound.test.cjs
          node scripts/v66133-consented-outreach.test.cjs
          node scripts/v66134-signed-email-events.test.cjs
          node scripts/v66135-outreach-durability.test.cjs
          node scripts/v66136-owner-sales-priorities.test.cjs
          node scripts/v66137-research-brief-nextday.test.cjs
          node --check enterprise/sbc-nextday-candidate-readiness-v1.cjs
          node --check routes/sbc-nextday-outbound-v1.cjs
          node --check enterprise/sales-caller-workspace-v6697.cjs
          node --check public/sbc-lorna-checklist.js
          node --check browser_public/sbc-lorna-checklist.js
          node --check public/lead-research.js
          node --check public/sbc-nextday-sales-prep-v1.js
          node --check browser_public/sbc-nextday-sales-prep-v1.js
          node --check public/sales-caller.js
          node --check browser_public/sales-caller.js
          node --check enterprise/sbc-outreach-consent-ledger.cjs
          node --check enterprise/sbc-outreach-signed-mailbox-relay.cjs
          node --check enterprise/sbc-unattended-notifications-v6504.cjs
          node --check enterprise/sbc-consented-outreach-email.cjs
          node --check routes/sbc-nextday-email-actions.cjs
          node --check routes/sbc-nextday-outbound-v1.cjs
          node --check public/sbc-nextday-sales-prep-v1.js
          node --check browser_public/sbc-nextday-sales-prep-v1.js
          python3 scripts/v66131-published-f4-smoke.py --self-test
          node scripts/v6675-payment-center-readback.test.cjs
          node scripts/v6677-service-offer-clarity.test.cjs
          node scripts/v6678-square-card-catalog-stage.cjs
          node scripts/v6679-monthly-care-checkouts.test.cjs
          node scripts/v6684-business-briefing.test.cjs
          node scripts/v6686-research-secondary-phone.test.cjs
          node scripts/v6504-unattended-notifications-test.js
          node scripts/v6673-owner-smtp-transport.test.cjs
          node scripts/v6687-notification-destination-durability.test.cjs
          node scripts/v6688-revenue-proof-notification-layout.test.cjs
          node scripts/v6614-voice-call-log-integrity-test.cjs
          node scripts/v6615-call-log-durable-test.cjs
          node scripts/v6689-business-phone-launch.test.cjs
          node scripts/v6690-voice-role-authorization.test.cjs
          node scripts/v6691-actionable-exceptions-voice-diagnostics.test.cjs
      - name: Source-level economic and payment evidence contract
        run: node scripts/v6602-payment-evidence-contract.test.cjs
      - name: Protected $1 QA reconciliation contract
        run: node scripts/v6685-protected-qa-reconciliation.test.cjs
      - name: Tenant economic cost and verified customer revenue contract
        run: node scripts/v6605-revenue-integrity.test.cjs
      - name: Shared 20 percent floor across governor, storefront and fulfillment
        run: node scripts/v6610-shared-margin-policy.test.cjs
      - name: Quote server hardening transform (syntax and anchor proof; no mutations)
        run: node scripts/v6606-quote-server-hardening.cjs
      - name: Quote server route behavior proof (in-memory mocks only)
        run: node scripts/v6606-quote-server-hardening.test.cjs
      - name: V66.82 owner lock binding and clearance regression (synthetic only)
        run: node scripts/v6682-financial-binding.test.cjs
      - name: Owner supplier-cost form validation (no charges)
        run: node scripts/v6607-cost-editor.test.cjs
      - name: Existing theme safety regression
        run: node hotfix-assets/v6555-theme-contrast-test.js

  auth-and-tenant:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Session security
        run: node scripts/v65112-auth-session-safety-test.js
      - name: CRM tenant isolation
        run: node scripts/v6605-crm-tenant-barrier-test.js
      - name: Legacy CRM tenant guards
        run: node scripts/v6620-legacy-crm-tenant-guard-test.cjs
      - name: Full website production, site generation and role-based fulfillment
        run: node --test test/sbc-preview-to-appointment.test.cjs test/sbc-prospect-site-factory.test.cjs test/sbc-website-workorders.test.cjs test/sbc-website-production-routes.test.cjs test/sbc-website-appointments.test.cjs
      - name: Tenant repository isolation
        run: node scripts/tenant-repository-isolation-test.js

  writer-and-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Writer lease heartbeat
        run: node scripts/v6617-writer-lease-heartbeat-test.cjs
      - name: Compiled runtime lease lifecycle regression
        run: node hotfix-assets/v6564-mysql-lease-lifecycle-test.js
      - name: Lease session verification
        run: node hotfix-assets/v6570-lease-session-verification-test.js
      - name: Economic control non-writer DDL block
        run: node hotfix-assets/v6558-economic-control-ddl-gate-test.js
      - name: Recovery data preservation
        run: node scripts/data-recovery-guard-test.js

  financial-vault-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: local_ci_only_sbc_6682
          MYSQL_DATABASE: sbc_v6682_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -plocal_ci_only_sbc_6682"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exact financial lock and vendor claim on isolated MySQL 8
        env:
          SBC_V6682_MYSQL_TEST: YES
          SBC_V6682_CI_MYSQL_PASSWORD: local_ci_only_sbc_6682
        run: node scripts/v6682-mysql-concurrency-ci.test.cjs
      - name: Verify snapshot tenant ownership against disposable MySQL
        env:
          SBC_SNAPSHOT_TENANT_CI: 'YES'
          SBC_V6682_CI_MYSQL_PASSWORD: local_ci_only_sbc_6682
        run: node --test test/sbc-snapshot-tenants.test.cjs

  recovery-snapshot-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: local_ci_only_sbc_v6683
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -plocal_ci_only_sbc_v6683"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Disposable MySQL 8 logical backup and strict row-digest restore
        env:
          CI: 'true'
          SBC_V6683_RESTORE_CI: 'YES'
          MYSQL_HOST: '127.0.0.1'
          MYSQL_PORT: '3306'
          SBC_V6683_CI_ROOT_PASSWORD: local_ci_only_sbc_v6683
        run: node scripts/v6683-full-recovery-ci.test.cjs

  security-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: SBC existing static security audit
        run: node scripts/security-check.js
      - name: Public prospect CSV privacy gate
        run: node scripts/v6612-public-prospect-privacy.test.cjs
      - name: Reject stale public diagnostics in published overlay
        run: node scripts/v66131-deprecated-diag-cleanup.test.cjs
      - name: HTTP static asset routing regression
        run: node scripts/v6624-static-assets.test.cjs
      - name: Current V66 flat release and verified server identity
        run: node scripts/v6603-flat-release-contract.test.cjs
      - name: CRM recovery and writer rejection behavior
        run: node scripts/runtime-integrity-test.js
      - name: Verify npm build command (prebuilt flat release; not a new ZIP build)
        run: npm run build
