name: SBC V6 Account Manager Launch Readiness — Ownership Drift
on:
  pull_request:
    branches: [a-sbc-master]
    paths:
      - 'enterprise/sbc-account-manager-readiness-v6.cjs'
      - 'routes/account-portfolios-v1.cjs'
      - 'public/sbc-account-portfolios-v1.js'
      - 'browser_public/sbc-account-portfolios-v1.js'
      - 'test/sbc-account-manager-readiness-v6.test.cjs'
      - '.github/workflows/sbc-v6-manager-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manager-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify syntax and frontend mirrors
        run: |
          node --check enterprise/sbc-account-manager-readiness-v6.cjs
          node --check routes/account-portfolios-v1.cjs
          node --check public/sbc-account-portfolios-v1.js
          cmp public/sbc-account-portfolios-v1.js browser_public/sbc-account-portfolios-v1.js
      - name: Install dependencies for Express route harness
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: V6 audited ownership and prior portfolio / research regressions
        run: |
          node --test test/sbc-account-manager-readiness-v6.test.cjs test/sbc-account-portfolios.test.cjs test/sbc-account-revenue-v5.test.cjs test/sbc-prospect-account-links-v4.test.cjs
