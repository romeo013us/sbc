name: Verify SBC V65.1.15 operational hotfix

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap.js'
      - 'package.json'
      - 'apply-v65115-hotfix.js'
      - 'hotfix-assets/**'
      - '.github/workflows/verify-sbc-v65115.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json

      - name: Validate root launch files
        run: |
          node --check bootstrap.js
          node --check apply-v65115-hotfix.js
          node -e "const p=require('./package.json'); if(p.name!=='sbc-business-command-center'||p.version!=='65.1.15'||p.scripts.start!=='node bootstrap.js') process.exit(1); console.log(p.name+'@'+p.version)"

      - name: Install root launcher dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Extract and apply the deterministic hotfix to the source bundle
        run: |
          set -euo pipefail
          rm -rf .ci-work
          mkdir -p .ci-work/source
          unzip -q SBC-OS-V65.1.13-ROOT-FIXED-LOCKFILE-BLOCKED.zip -d .ci-work/source
          node -e "const p=require('./apply-v65115-hotfix.js'); const r=p.apply(require('path').resolve('.ci-work/source')); console.log(JSON.stringify(r))"
          node --check .ci-work/source/server.js
          node --check .ci-work/source/enterprise/session-store.js
          node -e "const p=require('./.ci-work/source/package.json'); const r=require('./.ci-work/source/config/release-identity.js'); if(p.version!=='65.1.15'||r.RELEASE_VERSION!==p.version) process.exit(1); console.log('patched release identity verified')"

      - name: Install source dependency lock
        working-directory: .ci-work/source
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Run complete SBC test suite
        working-directory: .ci-work/source
        run: npm run test:all

      - name: Run predeploy open gate
        working-directory: .ci-work/source
        run: npm run predeploy:open-gate

      - name: Package integrity test
        run: |
          test -f .ci-work/source/package.json
          test -f .ci-work/source/package-lock.json
          test -f .ci-work/source/server.js
          unzip -t SBC-OS-V65.1.13-ROOT-FIXED-LOCKFILE-BLOCKED.zip >/dev/null
          echo "Source archive, hotfix overlay, and release identity checks passed."
