name: SBC Prospect Offline Opportunity V3
on:
  pull_request:
    branches: [a-sbc-master]
    paths:
      - 'public/sbc-prospect-opportunity-v3.js'
      - 'browser_public/sbc-prospect-opportunity-v3.js'
      - 'public/sbc-prospect-intelligence.js'
      - 'browser_public/sbc-prospect-intelligence.js'
      - 'test/sbc-prospect-opportunity-v3.test.cjs'
      - '.github/workflows/sbc-prospect-offline-v3.yml'
  push:
    branches: [a-sbc-master]
    paths:
      - 'public/sbc-prospect-opportunity-v3.js'
      - 'browser_public/sbc-prospect-opportunity-v3.js'
      - 'test/sbc-prospect-opportunity-v3.test.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-opportunity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Syntax and secure source mirror
        run: |
          node --check public/sbc-prospect-opportunity-v3.js
          node --check public/sbc-prospect-intelligence.js
          cmp public/sbc-prospect-opportunity-v3.js browser_public/sbc-prospect-opportunity-v3.js
          cmp public/sbc-prospect-intelligence.js browser_public/sbc-prospect-intelligence.js
      - name: Offline opportunity, consent and scoring tests
        run: node --test test/sbc-prospect-opportunity-v3.test.cjs test/sbc-prospect-intelligence.test.cjs test/sbc-prospect-workforce-v2.test.cjs test/sbc-prospect-packet-library.test.cjs
      - name: No-network simulated prospect journey
        run: |
          node scripts/sbc-prospect-handoff-v2-rehearsal.cjs
          node -e "const r=require('./public/sbc-prospect-opportunity-v3.js').offlineRehearsal();if(!r.pass||r.networkCalls!==0||r.payments!==0||r.crmWrites!==0)process.exit(1);console.log(JSON.stringify(r))"
