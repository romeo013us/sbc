name: SBC Shared Core Contract
on:
  pull_request:
  push:
    branches:
      - a-sbc-master
      - a-officebox-v156-godaddy-preview-20261121
permissions:
  contents: read
jobs:
  shared-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/sbc-core-contract.test.cjs
      - run: |
          echo '603fac3aec0da181cd325d7a53188ece76958cbe  shared/sbc-core/index.cjs' | while read expected file; do test "$(git hash-object "$file")" = "$expected" || exit 1; done
