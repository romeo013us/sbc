<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{businessName}} | Print & Business Services</title><style>:root{--primary:{{primaryColor}};--accent:{{accentColor}}}body{font-family:Arial,sans-serif;margin:0;background:#f6f8fb;color:#111}.hero{padding:72px 8%;background:linear-gradient(135deg,var(--primary),#111827);color:#fff}.hero h1{font-size:clamp(2.2rem,6vw,5rem);margin:0 0 12px}.hero p{font-size:1.2rem;max-width:720px}.cta{display:inline-block;margin-top:18px;padding:14px 20px;background:var(--accent);color:#fff;text-decoration:none;border-radius:12px;font-weight:700}.contact{padding:28px 8%;background:#fff}</style></head><body><section class="hero"><h1>{{businessName}}</h1><p>{{tagline}}</p><a class="cta" href="{{fulfillmentLink}}">Start Your Order</a></section><section class="contact"><strong>Contact</strong><div>{{phone}}</div><div>{{email}}</div></section></body></html>
