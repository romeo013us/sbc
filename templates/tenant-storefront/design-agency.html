<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{businessName}} | Design Agency</title><style>:root{--primary:{{primaryColor}};--accent:{{accentColor}}}body{font-family:Arial,sans-serif;margin:0;background:#0b1020;color:#fff}.hero{min-height:70vh;padding:10%;display:flex;flex-direction:column;justify-content:center;background:radial-gradient(circle at 80% 20%,var(--accent),transparent 30%),linear-gradient(145deg,var(--primary),#080b14)}h1{font-size:clamp(2.5rem,7vw,6rem);margin:0}.hero p{font-size:1.25rem;max-width:720px}.cta{display:inline-block;width:max-content;padding:15px 22px;background:#fff;color:#111;text-decoration:none;border-radius:14px;font-weight:800}.contact{padding:28px 10%;background:#111827}</style></head><body><section class="hero"><h1>{{businessName}}</h1><p>{{tagline}}</p><a class="cta" href="{{fulfillmentLink}}">Work With Us</a></section><section class="contact">{{phone}} · {{email}}</section></body></html>
